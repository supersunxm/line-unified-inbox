name: Apply dashboard StoreMaster schema patch

on:
  push:
    branches:
      - feat/dashboard-storemaster-peer-groups

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dashboard-storemaster-peer-groups
          fetch-depth: 0
      - name: Apply generated schema patch
        run: node scripts/.apply-dashboard-storemaster-schema.mjs
      - name: Commit schema patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/prisma/schema.prisma scripts/.apply-dashboard-storemaster-schema.mjs .github/workflows/.apply-dashboard-storemaster-schema.yml
          git commit -m "feat(dashboard): add StoreMaster peer metadata fields"
          git push origin HEAD:feat/dashboard-storemaster-peer-groups
