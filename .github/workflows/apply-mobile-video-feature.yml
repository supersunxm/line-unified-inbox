name: Apply mobile video feature

on:
  push:
    branches:
      - feat/mobile-video-attachment-entry
    paths:
      - .github/workflows/apply-mobile-video-feature.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-video-attachment-entry
          fetch-depth: 0
      - name: Apply precise feature patch
        run: |
          python scripts/fix-mobile-video-patcher.py
          python scripts/apply-mobile-video-feature.py
          git diff --check
      - name: Commit feature implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(mobile): send video attachments to LINE customers"
          git push origin HEAD:feat/mobile-video-attachment-entry
