name: GitHub Container Packages Audit

on:
  push:
    branches:
      - chore/actions-storage-cleanup-20261003
    paths:
      - ".github/workflows/actions-storage-audit.yml"

permissions:
  contents: read
  packages: read

jobs:
  audit:
    name: Audit container packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List container packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          echo "# GitHub Container Packages audit" | tee -a "$GITHUB_STEP_SUMMARY"

          if gh api "/users/$OWNER/packages?package_type=container&per_page=100" > /tmp/containers.json 2>/tmp/containers.err; then
            COUNT="$(jq 'length' /tmp/containers.json)"
            echo "CONTAINER_PACKAGE_COUNT=$COUNT"
            jq -r '.[] | "PACKAGE=" + .name + " VERSIONS=" + (.version_count|tostring) + " VISIBILITY=" + .visibility + " CREATED=" + .created_at + " UPDATED=" + .updated_at' /tmp/containers.json

            {
              echo
              echo "- Container packages visible: **$COUNT**"
              echo
              echo "## Packages"
              jq -r '.[] | "- " + .name + ": **" + (.version_count|tostring) + " versions**, " + .visibility + ", updated " + .updated_at' /tmp/containers.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CONTAINER_PACKAGE_QUERY_FAILED"
            cat /tmp/containers.err
            exit 0
          fi
