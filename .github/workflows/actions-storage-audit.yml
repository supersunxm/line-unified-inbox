name: Set Actions Retention

on:
  push:
    branches:
      - chore/actions-storage-cleanup-20261003
    paths:
      - ".github/workflows/actions-storage-audit.yml"

permissions:
  actions: write
  contents: read

jobs:
  set-retention:
    name: Set repository artifact retention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set artifact and log retention to 1 day
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          ENDPOINT="/repos/${GITHUB_REPOSITORY}/actions/permissions/artifact-and-log-retention"

          echo "CURRENT_RETENTION:"
          gh api "$ENDPOINT" || true

          if gh api --method PUT "$ENDPOINT" -f days=1; then
            echo "RETENTION_UPDATE=SUCCESS"
            echo "UPDATED_RETENTION:"
            gh api "$ENDPOINT" || true
          else
            echo "RETENTION_UPDATE=NOT_AUTHORIZED"
          fi
