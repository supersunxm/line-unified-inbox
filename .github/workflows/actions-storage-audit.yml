name: GitHub Packages Storage Audit

on:
  push:
    branches:
      - chore/actions-storage-cleanup-20261003
    paths:
      - ".github/workflows/actions-storage-audit.yml"

permissions:
  contents: read
  packages: read

jobs:
  audit:
    name: Audit GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List account packages and versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          TYPES=(container npm maven rubygems nuget)
          TOTAL_PACKAGES=0
          TOTAL_VERSIONS=0

          echo "# GitHub Packages audit" | tee -a "$GITHUB_STEP_SUMMARY"

          for TYPE in "${TYPES[@]}"; do
            echo "=== PACKAGE_TYPE=$TYPE ==="
            TMP="/tmp/packages-$TYPE.json"
            if gh api --paginate --slurp "/users/$OWNER/packages?package_type=$TYPE&per_page=100" > "$TMP" 2>"/tmp/packages-$TYPE.err"; then
              jq '[.[][]]' "$TMP" > "/tmp/packages-$TYPE-flat.json"
              COUNT="$(jq 'length' "/tmp/packages-$TYPE-flat.json")"
              TOTAL_PACKAGES=$((TOTAL_PACKAGES + COUNT))
              echo "PACKAGE_TYPE_$TYPE=$COUNT"

              if [ "$COUNT" -gt 0 ]; then
                jq -r '.[].name' "/tmp/packages-$TYPE-flat.json" | while IFS= read -r NAME; do
                  ENCODED="$(jq -rn --arg v "$NAME" '$v|@uri')"
                  VFILE="/tmp/versions-$TYPE-${RANDOM}.json"
                  if gh api --paginate --slurp "/users/$OWNER/packages/$TYPE/$ENCODED/versions?per_page=100" > "$VFILE" 2>/tmp/version.err; then
                    VCOUNT="$(jq '[.[][]] | length' "$VFILE")"
                    echo "PACKAGE=$TYPE/$NAME VERSIONS=$VCOUNT"
                    echo "- $TYPE / $NAME: **$VCOUNT versions**" >> "$GITHUB_STEP_SUMMARY"
                    TOTAL_VERSIONS=$((TOTAL_VERSIONS + VCOUNT))
                  else
                    echo "PACKAGE=$TYPE/$NAME VERSIONS=UNREADABLE"
                    cat /tmp/version.err || true
                  fi
                done
              fi
            else
              echo "PACKAGE_TYPE_$TYPE=UNREADABLE"
              cat "/tmp/packages-$TYPE.err" || true
            fi
          done

          echo "TOTAL_PACKAGES=$TOTAL_PACKAGES"
          echo "TOTAL_VERSIONS=$TOTAL_VERSIONS"
          {
            echo
            echo "- Total packages visible to this repository token: **$TOTAL_PACKAGES**"
            echo "- Total package versions counted: **$TOTAL_VERSIONS**"
          } >> "$GITHUB_STEP_SUMMARY"
