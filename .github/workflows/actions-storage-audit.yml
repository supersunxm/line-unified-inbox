name: Actions Storage Cleanup

on:
  push:
    branches:
      - chore/actions-storage-cleanup-20261003
    paths:
      - ".github/workflows/actions-storage-audit.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete stale QA artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete identified stale artifacts and verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          DELETE_IDS=(10345207639 10347501242 10347632979)
          for id in "${DELETE_IDS[@]}"; do
            echo "Deleting artifact $id"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
          done

          gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > /tmp/pages.json
          jq '[.[].artifacts[]]' /tmp/pages.json > /tmp/artifacts.json

          COUNT="$(jq 'length' /tmp/artifacts.json)"
          BYTES="$(jq '[.[].size_in_bytes] | add // 0' /tmp/artifacts.json)"
          MIB="$(awk -v b="$BYTES" 'BEGIN { printf "%.2f", b/1024/1024 }')"

          echo "REMAINING_ARTIFACT_COUNT=$COUNT"
          echo "REMAINING_ARTIFACT_BYTES=$BYTES"
          echo "REMAINING_ARTIFACT_MIB=$MIB"

          {
            echo "# Actions storage cleanup"
            echo
            echo "- Deleted stale artifact IDs: **${DELETE_IDS[*]}**"
            echo "- Remaining artifacts: **$COUNT**"
            echo "- Remaining artifact storage: **$MIB MiB**"
            echo
            echo "## Remaining artifacts"
            jq -r '.[] | [((.size_in_bytes/1048576)*100|round/100), .created_at, .expires_at, .name, .id] | @tsv' /tmp/artifacts.json |
              while IFS=$'\t' read -r size created expires name id; do
                printf -- '- %s MiB | %s | %s | id=%s\n' "$size" "$created" "$name" "$id"
              done
          } | tee -a "$GITHUB_STEP_SUMMARY"
