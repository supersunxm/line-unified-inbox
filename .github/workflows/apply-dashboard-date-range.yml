name: Apply dashboard date range migration

on:
  push:
    paths:
      - .github/workflows/apply-dashboard-date-range.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source migration
        run: python .github/scripts/apply-dashboard-date-range.py
      - name: Commit migration and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-dashboard-date-range.py .github/workflows/apply-dashboard-date-range.yml
          git add backend/src/dashboard-analytics.service.ts frontend/src/app/dashboard/executive-dashboard-v2.tsx
          git commit -m "feat(dashboard): add custom date range selection"
          git push
