name: Apply mobile tag delete hotfix

on:
  push:
    branches:
      - agent/fix-mobile-tag-delete

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-tag-delete
          fetch-depth: 0

      - name: Patch delete persistence and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sheet = Path('android_app/lib/features/chat/widgets/conversation_tags_sheet.dart')
          text = sheet.read_text()
          old = '''  void _removeProduct(int index) {
            setState(() {
              _selectedProducts.removeAt(index);
            });
          }
          '''
          new = '''  Future<void> _removeProduct(int index) async {
            if (_saving || index < 0 || index >= _selectedProducts.length) return;

            final previousProducts =
                List<CustomerSalesProductItem>.from(_selectedProducts);
            setState(() {
              _selectedProducts.removeAt(index);
              _saving = true;
              _error = null;
            });

            final payloadProducts = _selectedProducts
                .map((p) => CustomerSalesProductItem(
                      id: p.id,
                      productModelId: p.productModelId,
                      productVariantId: p.productVariantId,
                      modelName: p.modelName,
                      seriesName: p.seriesName,
                      category: p.category,
                      ram: p.ram,
                      rom: p.rom,
                      color: p.color,
                      quantity: p.quantity,
                      status: _status,
                    ))
                .toList();

            try {
              final detail = await widget.repository.updateCustomerSalesInfo(
                widget.conversationId,
                status: _status,
                interestLevel: _status == 'INTERESTED' ? _interestLevel : null,
                purchaseChannel:
                    _status == 'PURCHASED' ? _sourceChannels.toList() : [],
                paymentMethod: _status == 'PURCHASED' ? _paymentMethod : null,
                products: payloadProducts,
              );
              if (!mounted) return;

              setState(() {
                _selectedProducts = List<CustomerSalesProductItem>.from(
                  detail.customerSalesInformation?.products ?? payloadProducts,
                );
                _saving = false;
                _lastSavedDetail = detail;
              });
            } catch (_) {
              if (!mounted) return;
              setState(() {
                _selectedProducts = previousProducts;
                _saving = false;
                _error = appLocalizations(context).unableToSaveTags;
              });
            }
          }
          '''
          if old not in text:
              raise SystemExit('expected _removeProduct block not found')
          sheet.write_text(text.replace(old, new, 1))

          test_file = Path('android_app/test/tagging_test.dart')
          test_text = test_file.read_text()
          marker = "void main() {\n"
          regression = r'''  testWidgets('deleting a sales product persists immediately', (tester) async {
            tester.view.physicalSize = const Size(1080, 2200);
            tester.view.devicePixelRatio = 1;
            addTearDown(tester.view.resetPhysicalSize);
            addTearDown(tester.view.resetDevicePixelRatio);

            final repository = _FakeTagRepository();
            const savedSales = CustomerSalesInformation(
              status: 'PURCHASED',
              purchaseChannel: ['ONLINE'],
              paymentMethod: 'INSTALLMENT',
              products: [
                CustomerSalesProductItem(
                  id: 'sp-1',
                  productModelId: 'model-1',
                  modelName: 'OPPO Reno16 Pro 5G',
                  seriesName: 'Reno16',
                  category: 'SMARTPHONE',
                  quantity: 1,
                  status: 'PURCHASED',
                ),
              ],
            );

            await tester.pumpWidget(MaterialApp(
              localizationsDelegates: AppLocalizations.localizationsDelegates,
              supportedLocales: AppLocalizations.supportedLocales,
              home: Scaffold(
                body: ConversationTagsSheet(
                  conversationId: 'conversation-1',
                  repository: repository,
                  initialTags: const ConversationTags(),
                  initialSalesInfo: savedSales,
                ),
              ),
            ));
            await tester.pumpAndSettle();

            expect(find.text('OPPO Reno16 Pro 5G'), findsOneWidget);
            expect(repository.saveCallCount, 0);

            await tester.tap(find.byIcon(Icons.delete_outline));
            await tester.pumpAndSettle();

            expect(repository.saveCallCount, 1);
            expect(repository.currentSales?.products, isEmpty);
            expect(find.text('OPPO Reno16 Pro 5G'), findsNothing);
          });

'''
          if "deleting a sales product persists immediately" not in test_text:
              if marker not in test_text:
                  raise SystemExit('void main marker not found')
              test_file.write_text(test_text.replace(marker, marker + regression, 1))
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-apply-mobile-tag-delete.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android_app/lib/features/chat/widgets/conversation_tags_sheet.dart android_app/test/tagging_test.dart .github/workflows/tmp-apply-mobile-tag-delete.yml
          git commit -m "fix(mobile): persist deleted sales tags"
          git push origin HEAD:agent/fix-mobile-tag-delete
