name: ChatGPT Fix Rich Menu Clear State

on:
  push:
    branches:
      - chatgpt/fix-rich-menu-clear-state

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Patch Rich Menu current-state derivation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          service_path = Path('backend/src/rich-menu/rich-menu.service.ts')
          source = service_path.read_text()

          old_selection = '      const isSelected = assignedSet.has(oa.id) && readinessStatus === "READY";\n'
          new_selection = (
              '      // Assignment represents the Rich Menu currently managed by this system.\n'
              '      // Publish attempts are historical and must not be treated as current after Clear Default.\n'
              '      const hasCurrentAssignment = assignedSet.has(oa.id);\n'
              '      const isSelected = hasCurrentAssignment && readinessStatus === "READY";\n'
          )
          if source.count(old_selection) != 1:
              raise SystemExit(f'Expected one readiness selection anchor, found {source.count(old_selection)}')
          source = source.replace(old_selection, new_selection, 1)

          latest_anchor = '      const latestAttempt = oa.richMenuPublishAttempts?.[0];\n'
          latest_index = source.find(latest_anchor)
          if latest_index < 0:
              raise SystemExit('Could not find latestAttempt anchor')
          if_anchor = '      if (latestAttempt) {'
          if_index = source.find(if_anchor, latest_index)
          if if_index < 0:
              raise SystemExit('Could not find latestAttempt status block')
          source = source[:if_index] + '      if (latestAttempt && hasCurrentAssignment) {' + source[if_index + len(if_anchor):]
          service_path.write_text(source)

          spec_path = Path('backend/src/rich-menu/rich-menu.spec.ts')
          spec = spec_path.read_text()
          test_name = 'RichMenuService.evaluateReadiness separates current assignment from historical publish attempts after clear default'
          if test_name not in spec:
              spec += r'''

test("RichMenuService.evaluateReadiness separates current assignment from historical publish attempts after clear default", async () => {
  const now = new Date();
  let assignments: Array<{ lineOfficialAccountId: string }> = [];

  const mockPrisma = {
    richMenuTemplate: {
      findUnique: async () => ({
        id: "tmpl-1",
        name: "Promotion Menu",
        areasJson: [],
        version: 3,
        assignments,
      }),
    },
    lineOfficialAccount: {
      findMany: async () => [
        {
          id: "oa-central-bangna",
          name: "OPPO Central Bangna",
          store: {
            id: "store-865",
            name: "OBS Central Bangna By OPPO",
            area: "Bangkok",
            region: null,
            storeMaster: {
              externalStoreId: "865",
              accountName: "OPPO Central Bangna",
              googleMapsUrl: null,
              province: "Bangkok",
            },
          },
          richMenuPublishAttempts: [
            {
              id: "attempt-old-published",
              status: "PUBLISHED",
              lineRichMenuId: "richmenu-old-123",
              completedAt: now,
              updatedAt: now,
              errorMessage: null,
              errorStage: null,
              templateVersion: 3,
            },
          ],
        },
      ],
    },
  } as any;

  const service = new RichMenuService(mockPrisma, {} as any);

  // Clear Default removes the assignment but intentionally preserves PUBLISHED history.
  const afterClear = await service.evaluateReadiness("tmpl-1");
  assert.equal(afterClear.items[0].selected, false);
  assert.equal(afterClear.items[0].publishStatus, "NOT_PUBLISHED");
  assert.equal(afterClear.items[0].publishedRichMenuId, null);
  assert.equal(afterClear.items[0].publishAttemptId, null);
  assert.equal(afterClear.items[0].isCurrentVersionPublished, false);

  // When the assignment exists, the same historical attempt is current for this template.
  assignments = [{ lineOfficialAccountId: "oa-central-bangna" }];
  const currentlyAssigned = await service.evaluateReadiness("tmpl-1");
  assert.equal(currentlyAssigned.items[0].publishStatus, "PUBLISHED");
  assert.equal(currentlyAssigned.items[0].publishedRichMenuId, "richmenu-old-123");
  assert.equal(currentlyAssigned.items[0].publishAttemptId, "attempt-old-published");
  assert.equal(currentlyAssigned.items[0].isCurrentVersionPublished, true);
});
'''
              spec_path.write_text(spec)
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit tested fix
        shell: bash
        run: |
          rm .github/workflows/chatgpt-fix-rich-menu-clear-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/rich-menu/rich-menu.service.ts backend/src/rich-menu/rich-menu.spec.ts .github/workflows/chatgpt-fix-rich-menu-clear-state.yml
          git commit -m "fix(rich-menu): refresh state after clear default"
          git push origin HEAD:chatgpt/fix-rich-menu-clear-state
