name: Apply installment finance options patch

on:
  push:
    branches: [feat/installment-finance-options]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/installment-finance-options
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_installment_finance_patch.py

      - name: Commit patch
        run: |
          rm .github/workflows/apply-installment-finance-options.yml
          rm scripts/apply_installment_finance_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(tagging): add installment finance options"
          git push origin HEAD:feat/installment-finance-options
