name: ChatGPT Greeting Store Visibility Fix

on:
  push:
    branches:
      - fix/greeting-store-targeting-visible

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/greeting-store-targeting-visible
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply focused UI visibility patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/app/greeting-messages/greeting-messages-view.tsx')
          text = path.read_text()

          marker = 'data-testid="greeting-store-quick-targeting"'
          if marker in text:
              print('Patch already applied')
              raise SystemExit(0)

          old_fn = '''  const handleSelectAllReadyStores = () => {\n    if (!readinessData) return;\n    setSelectedStoreOaIds(\n      readinessData.stores\n        .filter((store) => store.readinessStatus === "READY")\n        .map((store) => store.lineOfficialAccountId),\n    );\n  };\n'''
          new_fn = old_fn + '''\n  const handleOpenStoreTargeting = () => {\n    setShowStoreSection(true);\n    window.setTimeout(() => {\n      document\n        .getElementById("greeting-store-targeting")\n        ?.scrollIntoView({ behavior: "smooth", block: "start" });\n    }, 0);\n  };\n'''
          if old_fn not in text:
              raise SystemExit('Could not find handleSelectAllReadyStores anchor')
          text = text.replace(old_fn, new_fn, 1)

          anchor = '''        <div className="flex items-center justify-between rounded-md border border-amber-200 bg-amber-50 px-4 py-3 text-xs text-amber-800">\n'''
          quick_panel = '''        <section\n          data-testid="greeting-store-quick-targeting"\n          className="rounded-lg border border-emerald-200 bg-emerald-50/50 p-4"\n        >\n          <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">\n            <div>\n              <div className="flex items-center gap-2">\n                <h2 className="text-sm font-bold text-gray-900">🏬 {ui.storeUsage}</h2>\n                {currentTemplate && (\n                  <span className="rounded-full bg-white px-2 py-0.5 text-[11px] font-medium text-gray-600 ring-1 ring-emerald-200">\n                    {currentTemplate.name}\n                  </span>\n                )}\n              </div>\n              <div className="mt-2 flex flex-wrap gap-2">\n                <span className="rounded-full bg-white px-2.5 py-1 text-[11px] font-medium text-emerald-700 ring-1 ring-emerald-200">\n                  {ui.assigned} {assignedCount}\n                </span>\n                <span className="rounded-full bg-white px-2.5 py-1 text-[11px] font-medium text-gray-700 ring-1 ring-gray-200">\n                  {ui.ready} {readyCount}\n                </span>\n                <span className="rounded-full bg-white px-2.5 py-1 text-[11px] font-medium text-amber-700 ring-1 ring-amber-200">\n                  {ui.blocked} {blockedCount}\n                </span>\n                <span className="rounded-full bg-blue-50 px-2.5 py-1 text-[11px] font-medium text-blue-700 ring-1 ring-blue-200">\n                  {ui.selected} {selectedStoreOaIds.length}\n                </span>\n              </div>\n            </div>\n\n            <div className="flex flex-wrap gap-2">\n              <button\n                type="button"\n                onClick={() => {\n                  handleSelectAllReadyStores();\n                  handleOpenStoreTargeting();\n                }}\n                disabled={!currentTemplate || readyCount === 0}\n                className="rounded border border-[#06c755] bg-white px-3.5 py-2 text-xs font-semibold text-[#06c755] hover:bg-emerald-50 disabled:opacity-40"\n              >\n                {ui.selectAllReady}\n              </button>\n              <button\n                type="button"\n                onClick={handleOpenStoreTargeting}\n                disabled={!currentTemplate}\n                className="rounded bg-[#06c755] px-4 py-2 text-xs font-semibold text-white hover:bg-[#05b34c] disabled:opacity-40"\n              >\n                {ui.manageStores}\n              </button>\n            </div>\n          </div>\n        </section>\n\n'''
          if anchor not in text:
              raise SystemExit('Could not find OA warning anchor')
          text = text.replace(anchor, quick_panel + anchor, 1)

          old_section = '''        <section className="space-y-4 border-t border-gray-200 pb-12 pt-8">\n'''
          new_section = '''        <section\n          id="greeting-store-targeting"\n          className="scroll-mt-24 space-y-4 border-t border-gray-200 pb-12 pt-8"\n        >\n'''
          if old_section not in text:
              raise SystemExit('Could not find store assignment section')
          text = text.replace(old_section, new_section, 1)

          path.write_text(text)
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit source fix
        run: |
          if git diff --quiet -- frontend/src/app/greeting-messages/greeting-messages-view.tsx; then
            echo "No source change to commit"
            exit 0
          fi
          git config user.name "chatgpt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/greeting-messages/greeting-messages-view.tsx
          git commit -m "fix(greeting): surface multi-store targeting controls"
          git push origin HEAD:fix/greeting-store-targeting-visible
