name: Unified Auth CI

on:
  pull_request:
    paths:
      - "backend/src/auth/**"
      - "backend/prisma/schema.prisma"
      - "backend/prisma/migrations/**"
      - "android_app/lib/features/auth/**"
      - "frontend/src/app/login/page.tsx"
      - "frontend/src/app/register/**"
      - "frontend/src/app/admin/registrations/**"
      - "frontend/src/lib/registration-api.ts"
      - ".github/workflows/unified-auth-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Apply migrations to clean PostgreSQL
        run: npx prisma migrate deploy

      - name: Lint unified auth scope
        run: >-
          npx eslint
          "src/auth/auth.service.ts"
          "src/auth/auth.guard.ts"
          "src/auth/permission-context.ts"
          "src/auth/permission-context.spec.ts"
          "src/auth/mobile-auth.dto.ts"
          "src/auth/mobile-auth.service.ts"
          "src/auth/mobile-login-identifier.spec.ts"
          "src/auth/store-access.service.ts"
          "src/auth/registration.service.ts"
          "src/auth/hq-registration.service.ts"
          "src/auth/hq-registration.service.spec.ts"
          "src/auth/unified-auth-stage2.spec.ts"

      - name: Unified auth regression tests
        run: >-
          npx tsx --test
          src/auth/permission-context.spec.ts
          src/auth/auth.service.spec.ts
          src/auth/auth.guard.spec.ts
          src/auth/mobile-auth.service.spec.ts
          src/auth/mobile-login-identifier.spec.ts
          src/auth/store-access.service.spec.ts
          src/auth/registration.service.spec.ts
          src/auth/hq-registration.service.spec.ts
          src/auth/unified-auth-stage2.spec.ts

      - name: Backend build
        run: npm run build

  web-registration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Web registration scope
        run: npx eslint "src/app/login/page.tsx" "src/app/register/page.tsx" "src/app/admin/registrations/page.tsx" "src/app/admin/registrations/hq/page.tsx" "src/lib/registration-api.ts"

      - name: Frontend build
        run: npm run build
