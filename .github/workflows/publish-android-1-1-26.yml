name: Publish Android 1.1.27

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-android-1-1-26.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download authoritative signed QA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/android47-artifact
          gh run download 34844508327 --repo "${{ github.repository }}" --name oppo-line-oa-chat-v1.1.27-qa --dir /tmp/android47-artifact
          test -f /tmp/android47-artifact/oppo-line-oa-chat-v1.1.27-qa.apk

      - name: Verify tested APK
        run: |
          set -euo pipefail
          APK="/tmp/android47-artifact/oppo-line-oa-chat-v1.1.27-qa.apk"
          EXPECTED_APK_SHA256="343005764bc5823143a2562a6de5dd5e10f2d1c918fbd4afcb8e4f3ffe5a0353"
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = "$EXPECTED_APK_SHA256"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_CODE="$("$AAPT" dump badging "$APK" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_NAME="$("$AAPT" dump badging "$APK" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$PACKAGE_ID" = "click.lineoppo.chat"
          test "$VERSION_NAME" = "1.1.27"
          test "$VERSION_CODE" = "47"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          EXPECTED_CERT_SHA256="e244a89876388b015bbd10abe39326aab15da2e1ec0fe0d6a8248855126af114"
          ACTUAL_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p; s/^V2 Signer: certificate SHA-256 digest: //p' /tmp/apk-signature.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Publish APK and release metadata
        run: |
          set -euo pipefail
          APK="/tmp/android47-artifact/oppo-line-oa-chat-v1.1.27-qa.apk"
          FILE="oppo-line-oa-chat-v1.1.27-production.apk"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          BYTES="$(stat -c%s "$APK")"
          SIZE_MB="$(python3 - <<PY
          print(f'{int("$BYTES")/1000000:.1f} MB')
          PY
          )"
          cp "$APK" "frontend/public/downloads/$FILE"

          mkdir -p backend/prisma/migrations/20260914160000_release_android_1_1_27
          cat > backend/prisma/migrations/20260914160000_release_android_1_1_27/migration.sql <<SQL
          INSERT INTO "AppRelease" (
            "id", "platform", "version", "buildNumber",
            "minimumSupportedVersion", "minimumSupportedBuildNumber",
            "forceUpdate", "apkUrl", "apkSize", "sha256",
            "releaseNotes", "isActive", "downloadCount", "createdAt", "updatedAt"
          ) VALUES (
            'app-release-android-1-1-27-47', 'ANDROID', '1.1.27', 47,
            '1.0.3', 4, false,
            'https://lineoppo.click/downloads/$FILE?sha=$SHA',
            '$SIZE_MB', '$SHA',
            ARRAY[
              'รองรับการรับไฟล์ PDF จากลูกค้าผ่าน LINE',
              'รองรับการส่งไฟล์ PDF จากแอปผ่านลิงก์เอกสารที่ปลอดภัย',
              'เพิ่มการเปิดและแสดงไฟล์ PDF ในห้องแชท'
            ]::TEXT[],
            true, 0, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          )
          ON CONFLICT ("platform", "buildNumber") DO UPDATE SET
            "version" = EXCLUDED."version",
            "minimumSupportedVersion" = EXCLUDED."minimumSupportedVersion",
            "minimumSupportedBuildNumber" = EXCLUDED."minimumSupportedBuildNumber",
            "forceUpdate" = EXCLUDED."forceUpdate",
            "apkUrl" = EXCLUDED."apkUrl",
            "apkSize" = EXCLUDED."apkSize",
            "sha256" = EXCLUDED."sha256",
            "releaseNotes" = EXCLUDED."releaseNotes",
            "isActive" = true,
            "updatedAt" = CURRENT_TIMESTAMP;

          UPDATE "AppRelease"
          SET "isActive" = false, "updatedAt" = CURRENT_TIMESTAMP
          WHERE "platform" = 'ANDROID' AND "buildNumber" < 47;
          SQL

          python3 <<PY
          from pathlib import Path
          releases = Path('frontend/src/app/download/releases.ts')
          text = releases.read_text()
          marker = 'export const androidReleases: AndroidRelease[] = [\n'
          entry = f'''  {{
            version: "1.1.27",
            build: 47,
            releasedAt: "2026-09-14",
            releasedAtDisplay: "14 กันยายน 2026",
            size: "$SIZE_MB",
            fileName: "$FILE",
            sha256: "$SHA",
            notes: [
              "รองรับการรับไฟล์ PDF จากลูกค้าผ่าน LINE",
              "รองรับการส่งไฟล์ PDF จากแอปผ่านลิงก์เอกสารที่ปลอดภัย",
              "เพิ่มการเปิดและแสดงไฟล์ PDF ในห้องแชท",
            ],
          }},
          '''
          if 'version: "1.1.27"' not in text:
              if marker not in text:
                  raise SystemExit('android release array marker not found')
              releases.write_text(text.replace(marker, marker + entry, 1))

          test_file = Path('frontend/test/android-download-release.test.mts')
          test_text = test_file.read_text()
          old = '../../backend/prisma/migrations/20260914150000_release_android_1_1_26/migration.sql'
          new = '../../backend/prisma/migrations/20260914160000_release_android_1_1_27/migration.sql'
          if new not in test_text:
              if old not in test_text:
                  raise SystemExit('release migration test marker not found')
              test_file.write_text(test_text.replace(old, new, 1))
          PY

          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Verify release payload
        run: |
          set -euo pipefail
          APK="frontend/public/downloads/oppo-line-oa-chat-v1.1.27-production.apk"
          MIGRATION="backend/prisma/migrations/20260914160000_release_android_1_1_27/migration.sql"
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = "$APK_SHA256"
          grep -Fq "'1.0.3', 4, false," "$MIGRATION"
          python3 <<'PY'
          from pathlib import Path
          migration = Path("backend/prisma/migrations/20260914160000_release_android_1_1_27/migration.sql").read_text()
          array_start = migration.index("ARRAY[")
          array_end = migration.index("]::TEXT[]", array_start)
          final_array_item = migration[array_start:array_end].splitlines()[-1].strip()
          if final_array_item.endswith(","):
              raise SystemExit("releaseNotes ARRAY has a trailing comma")
          PY
          git diff --check

      - name: Commit release to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/public/downloads/oppo-line-oa-chat-v1.1.27-production.apk \
            frontend/src/app/download/releases.ts \
            frontend/test/android-download-release.test.mts \
            backend/prisma/migrations/20260914160000_release_android_1_1_27/migration.sql
          git diff --cached --quiet && exit 0
          git commit -m "chore(android): release 1.1.27+47"
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
