name: Coupon Management CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "android_app/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Apply migrations to clean PostgreSQL
        run: npx prisma migrate deploy

      - name: Lint changed backend scope
        run: npx eslint "src/coupons/**/*.ts" "src/app-version/**/*.ts" "src/app.module.ts"

      - name: Coupon unit tests
        run: npx tsx --test src/coupons/*.spec.ts

      - name: App version unit tests
        run: npx tsx --test src/app-version/app-version.service.spec.ts

      - name: Build
        run: npm run build

      - name: Smoke test backend and coupon auth guard
        env:
          NODE_ENV: test
          PORT: 3001
          FRONTEND_URL: http://localhost:3000
          EMAIL_PROVIDER: none
          LINE_WEBHOOK_ENABLED: "false"
          PILOT_MODE: "false"
        run: |
          export LINE_CREDENTIAL_ENCRYPTION_KEY="$(printf '0123456789abcdef0123456789abcdef' | base64 | tr -d '\n')"
          node dist/main.js > /tmp/coupon-backend.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill "$BACKEND_PID" 2>/dev/null || true' EXIT

          HEALTH_CODE="000"
          for attempt in $(seq 1 30); do
            HEALTH_CODE="$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3001/health || true)"
            if [ "$HEALTH_CODE" = "200" ]; then
              break
            fi
            sleep 1
          done

          if [ "$HEALTH_CODE" != "200" ]; then
            cat /tmp/coupon-backend.log
            exit 1
          fi

          COUPON_CODE="$(curl -sS -o /tmp/coupon-unauthorized.json -w '%{http_code}' http://127.0.0.1:3001/coupons || true)"
          if [ "$COUPON_CODE" != "401" ]; then
            echo "Expected unauthenticated GET /coupons to return 401, got $COUPON_CODE"
            cat /tmp/coupon-unauthorized.json || true
            cat /tmp/coupon-backend.log
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint coupon frontend scope
        run: npx eslint "src/app/coupons/**/*.tsx" "src/lib/coupon-api.ts" "src/types/coupons.ts" "src/app/primary-navigation.ts" "src/components/shell/top-navigation.tsx"

      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
