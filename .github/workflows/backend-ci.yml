name: Application CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Apply migrations to clean PostgreSQL
        run: npx prisma migrate deploy

      - name: Lint regression scope
        run: npx eslint "src/coupons/**/*.ts" "src/app-version/**/*.ts" "src/mobile/mobile-conversations.service.ts" "src/mobile/mobile-customer-sales-activity.spec.ts" "src/mobile/mobile-video-preview.ts" "src/mobile/mobile-video-preview.spec.ts" "src/conversation-data-contract.ts" "src/conversation-data-contract.spec.ts" "src/purchase-analytics.controller.ts" "src/purchase-analytics.dto.ts" "src/purchase-analytics.service.ts" "src/purchase-analytics.service.spec.ts" "src/purchase-broadcast-audience.dto.ts" "src/purchase-broadcast-audience.service.ts" "src/purchase-broadcast-audience.service.spec.ts" "src/purchase-broadcast-composer.service.spec.ts" "src/mass-message/mass-message.controller.ts" "src/mass-message/mass-message-selected-users-guard.spec.ts" "src/dashboard.controller.ts" "src/dashboard-executive.service.ts" "src/dashboard-executive.service.spec.ts" "src/app.module.ts" "src/line-chat/line-chat-session-health-probe.service.ts" "src/line-chat/line-chat-session-health-probe.spec.ts" "src/line-chat/line-chat-health-probe.cli.ts" "src/line-chat/line-chat-health-probe.cli.spec.ts" "src/line-chat/line-chat-oa-health-probe.service.ts" "src/line-chat/line-chat-oa-health-probe.spec.ts" "src/line-chat/line-chat-oa-health-probe.cli.ts" "src/line-chat/line-chat-oa-health-probe.cli.spec.ts" "src/line-chat/line-chat-health-scheduler.service.ts" "src/line-chat/line-chat-health-scheduler.spec.ts" "src/line-chat/line-chat-operations.controller.ts" "src/line-chat/line-chat-operations-auth.spec.ts" "src/line-chat/line-chat.module.ts" "src/line-chat/line-chat-nickname-worker.module.ts" "src/google-review-kpi/google-review-kpi.controller.ts" "src/google-review-kpi/google-review-kpi-canonical-export.spec.ts"

      - name: Nickname source contract lint
        run: npx eslint src/line-chat/nickname-source*.ts src/line-chat/line-chat-chat-discovery.ts src/line-chat/line-chat-session.service.ts src/line-chat-nickname.installment-finance.spec.ts

      - name: Nickname source contract and database regression tests
        env:
          NICKNAME_SOURCE_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx tsx --test src/line-chat/nickname-source*.spec.ts src/line-chat-nickname.installment-finance.spec.ts src/line-chat/line-chat-chat-discovery.spec.ts

      - name: Mirror cutover lint
        run: npx eslint "src/conversations.service.ts" "src/line-chat/line-chat-pilot.constants.ts" "src/line-chat/line-chat-message-send-queue.service.ts" "src/line-chat/line-chat-message-send-worker.service.ts" "src/line-chat/line-chat-manager-message-relay.service.ts" "src/line-chat/line-chat-manager-message-relay-worker.service.ts" "src/line-chat/line-chat-manager-image-relay-worker.service.ts" "src/line-chat/line-chat-manager-media-materializer.service.ts" "src/line-chat/line-chat-manager-media-materializer.spec.ts" "src/line-chat/line-chat-manager-nickname-sales-tag.ts" "src/line-chat/line-chat-manager-nickname-sales-tag.spec.ts" "src/line-chat/line-chat-mirror-sales-tag-sync.service.ts" "src/line-chat/line-chat-mirror-sales-tag-sync.service.spec.ts" "src/line-chat/line-chat-mirror.service.ts" "src/line-chat/line-chat-mirror.service.spec.ts" "src/line-chat/line-chat-mirror-reconciler.service.ts" "src/line-chat/line-chat-mirror-reconciler.service.spec.ts" "src/line-chat/line-chat-store-oa-selector.ts" "src/line-chat/line-chat-store-oa-selector.spec.ts" "src/line-chat/line-chat-store-chat-parity.spec.ts" "src/line-chat/line-chat-mirror-cutover.spec.ts" "src/line-chat/line-chat-recent-resolver.service.spec.ts"

      - name: Mirror cutover regression tests
        run: npx tsx --test src/line-chat/line-chat-mirror-cutover.spec.ts src/line-chat/line-chat-mirror-reconciler.service.spec.ts src/line-chat/line-chat-store-oa-selector.spec.ts src/line-chat/line-chat-store-chat-parity.spec.ts src/line-chat/line-chat-manager-media-materializer.spec.ts src/line-chat/line-chat-manager-nickname-sales-tag.spec.ts src/line-chat/line-chat-mirror-sales-tag-sync.service.spec.ts

      - name: Mirror identity bridge lint and database regression
        run: |
          npx eslint src/line-chat/mirror-identity*.ts src/line-chat/mirror-direct-url*.ts src/conversations.controller.ts
          npx tsx --test src/line-chat/mirror-direct-url.spec.ts
          node <<'JS'
          const { PrismaClient } = require('@prisma/client');
          const { execFileSync } = require('node:child_process');
          const db = new PrismaClient();
          (async () => {
            // Nickname tests preserve append-only fixtures. Never weaken fleet
            // scope checks or delete those fixtures to share their database.
            await db.$executeRawUnsafe('CREATE DATABASE mirror_identity_bridge_ci');
            await db.$disconnect();
            const url = new URL(process.env.DATABASE_URL);
            url.pathname = '/mirror_identity_bridge_ci';
            const env = { ...process.env, DATABASE_URL: url.toString(), MIRROR_IDENTITY_TEST_DATABASE_URL: url.toString() };
            execFileSync('npx', ['prisma', 'migrate', 'deploy'], { env, stdio: 'inherit' });
            execFileSync('npx', ['tsx', '--test', 'src/line-chat/mirror-identity-contract.spec.ts', 'src/line-chat/mirror-identity-bridge.integration.spec.ts'], { env, stdio: 'inherit' });
          })().catch(async () => { await db.$disconnect(); process.exitCode = 1; });
          JS

      - name: Exact manifest and Historical source anchor lint
        run: npx eslint src/line-chat/line-chat-mirror-exact-manifest.ts src/line-chat/line-chat-mirror-exact-manifest.cli.ts src/line-chat/line-chat-mirror-exact-manifest.spec.ts src/historical-source-anchors.ts src/historical-source-anchors.spec.ts src/canonical-source-identity.ts src/canonical-source-identity.spec.ts src/historical-timeline.service.ts src/historical-timeline.service.spec.ts

      - name: Exact manifest and Historical source anchor regression tests
        run: npx tsx --test src/line-chat/line-chat-mirror-exact-manifest.spec.ts src/historical-source-anchors.spec.ts src/canonical-source-identity.spec.ts src/historical-timeline.service.spec.ts

      - name: LINE chat health regression tests
        run: npx tsx --test src/line-chat/line-chat-health.spec.ts src/line-chat/line-chat-profile-operation-coordinator.service.spec.ts src/line-chat/line-chat-session-health-probe.spec.ts src/line-chat/line-chat-health-probe.cli.spec.ts src/line-chat/line-chat-oa-health-probe.spec.ts src/line-chat/line-chat-oa-health-probe.cli.spec.ts src/line-chat/line-chat-health-scheduler.spec.ts src/line-chat/line-chat-operations-auth.spec.ts src/line-chat/line-chat-nickname-worker.service.spec.ts src/line-chat/line-chat-recent-resolver.service.spec.ts src/line-chat/line-chat-mirror.service.spec.ts

      - name: Nickname Parser v3 lint and regression tests
        env:
          NICKNAME_DERIVED_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          npx eslint src/line-chat/nickname-derived-metadata-rollout.cli.ts src/line-chat/nickname-derived-metadata.contract.ts src/line-chat/nickname-derived-metadata.contract.spec.ts src/line-chat/nickname-derived-metadata.integration.spec.ts src/line-chat/nickname-derived-metadata.migration.spec.ts src/line-chat/nickname-derived-metadata.service.ts src/line-chat/nickname-parser-v3-products.ts src/line-chat/nickname-parser-v3-products.spec.ts src/line-chat/nickname-parser-v3-dry-run.cli.ts src/line-chat/nickname-parser-v3.contract.ts src/line-chat/nickname-parser-v3.contract.spec.ts src/conversations.service.ts
          npx tsx --test src/line-chat/nickname-derived-metadata.contract.spec.ts src/line-chat/nickname-derived-metadata.migration.spec.ts src/line-chat/nickname-derived-metadata.integration.spec.ts src/line-chat/nickname-parser-v3-products.spec.ts src/line-chat/nickname-parser-v3.contract.spec.ts src/line-chat/nickname-source-contract.spec.ts

      - name: Manual Manager recovery regression
        run: |
          npx eslint src/line-chat/line-chat-novnc-recovery-worker.service.ts src/line-chat/line-chat-novnc-recovery.service.ts src/line-chat/line-chat-novnc-recovery-profile.spec.ts
          npx tsx --test src/line-chat/line-chat-novnc-recovery-profile.spec.ts src/line-chat/line-chat-novnc-recovery-worker.service.spec.ts

      - name: Coupon unit tests
        run: npx tsx --test src/coupons/*.spec.ts

      - name: App version unit tests
        run: npx tsx --test src/app-version/app-version.service.spec.ts

      - name: Conversation data contract regression tests
        run: npx tsx --test src/conversation-data-contract.spec.ts

      - name: Reply state resolver lint
        run: npx prisma generate && npx eslint "src/reply-state-resolver.ts" "src/reply-state-resolver.spec.ts" "src/reply-state-mismatch-cause.ts" "src/reply-state-mismatch-cause.spec.ts" "src/reply-state-evidence-window.ts" "src/reply-state-evidence-window.spec.ts" "src/reply-state-effective.ts" "src/reply-state-effective.spec.ts" "src/reply-cycle-analytics.ts" "src/reply-cycle-analytics.spec.ts" "src/reply-cycle-historical-evidence.ts" "src/reply-cycle-historical-evidence.spec.ts" "src/mobile/monthly-summary.service.ts" "src/mobile/monthly-summary.service.spec.ts" "src/reply-state-coverage-audit.ts" "src/reply-state-projection-sync.ts" "src/reply-state-shadow.service.ts" "src/reply-state-shadow.service.spec.ts" "src/conversations.controller.ts" "src/app.module.ts"

      - name: Reply state resolver tests
        run: npx tsx --test src/reply-state-resolver.spec.ts src/reply-state-mismatch-cause.spec.ts src/reply-state-evidence-window.spec.ts src/reply-state-effective.spec.ts src/reply-cycle-analytics.spec.ts src/reply-cycle-historical-evidence.spec.ts src/mobile/monthly-summary.service.spec.ts src/reply-state-shadow.service.spec.ts

      - name: Mobile sales audit regression tests
        run: npx tsx --test src/mobile/mobile-customer-sales-activity.spec.ts

      - name: Mobile video preview runtime regression tests
        run: npx tsx --test src/mobile/mobile-video-preview.spec.ts

      - name: Purchase intelligence and broadcast audience regression tests
        run: npx tsx --test src/purchase-analytics.service.spec.ts src/purchase-broadcast-audience.service.spec.ts src/purchase-broadcast-composer.service.spec.ts src/mass-message/mass-message-selected-users-guard.spec.ts

      - name: Multi-store Broadcast targeting regression tests
        run: npx tsx --test src/mass-message/broadcast-targeting.spec.ts src/mass-message/broadcast-store-variables.spec.ts src/mass-message/broadcast-controller.spec.ts

      - name: Executive dashboard regression tests
        run: npx tsx --test src/dashboard-executive.service.spec.ts

      - name: Canonical Store ID export regression tests
        run: npx tsx --test src/line-official-accounts/line-official-account-canonical-export.spec.ts src/google-review-kpi/google-review-kpi-canonical-export.spec.ts

      - name: Build
        run: npm run build

      - name: Smoke test backend auth guards
        env:
          NODE_ENV: test
          PORT: 3001
          FRONTEND_URL: http://localhost:3000
          EMAIL_PROVIDER: none
          LINE_WEBHOOK_ENABLED: "false"
          PILOT_MODE: "false"
        run: |
          export LINE_CREDENTIAL_ENCRYPTION_KEY="$(printf '0123456789abcdef0123456789abcdef' | base64 | tr -d '\n')"
          node dist/main.js > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill "$BACKEND_PID" 2>/dev/null || true' EXIT

          HEALTH_CODE="000"
          for attempt in $(seq 1 30); do
            HEALTH_CODE="$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3001/health || true)"
            if [ "$HEALTH_CODE" = "200" ]; then
              break
            fi
            sleep 1
          done

          if [ "$HEALTH_CODE" != "200" ]; then
            cat /tmp/backend.log
            exit 1
          fi

          COUPON_CODE="$(curl -sS -o /tmp/coupon-unauthorized.json -w '%{http_code}' http://127.0.0.1:3001/coupons || true)"
          if [ "$COUPON_CODE" != "401" ]; then
            echo "Expected unauthenticated GET /coupons to return 401, got $COUPON_CODE"
            cat /tmp/coupon-unauthorized.json || true
            cat /tmp/backend.log
            exit 1
          fi

          BROADCAST_PREVIEW_CODE="$(curl -sS -X POST -H 'Content-Type: application/json' -d '{}' -o /tmp/broadcast-preview-unauthorized.json -w '%{http_code}' http://127.0.0.1:3001/broadcasts/preview || true)"
          if [ "$BROADCAST_PREVIEW_CODE" != "401" ]; then
            echo "Expected unauthenticated POST /broadcasts/preview to return 401, got $BROADCAST_PREVIEW_CODE"
            cat /tmp/broadcast-preview-unauthorized.json || true
            cat /tmp/backend.log
            exit 1
          fi

          DASHBOARD_CODE="$(curl -sS -o /tmp/dashboard-unauthorized.json -w '%{http_code}' http://127.0.0.1:3001/dashboard/executive-store-health?period=7d || true)"
          if [ "$DASHBOARD_CODE" != "401" ]; then
            echo "Expected unauthenticated executive dashboard route to return 401, got $DASHBOARD_CODE"
            cat /tmp/dashboard-unauthorized.json || true
            cat /tmp/backend.log
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint regression scope
        run: npx eslint "src/app/coupons/**/*.tsx" "src/app/admin/purchase-analytics/page.tsx" "src/app/mass-messages/page.tsx" "src/app/mass-messages/purchase-broadcast-draft-banner.tsx" "src/app/mass-messages/purchase-broadcast-composer.tsx" "src/app/mass-messages/drafts/[campaignId]/page.tsx" "src/app/dashboard/dashboard-view.tsx" "src/app/dashboard/executive-dashboard-v2.tsx" "src/lib/coupon-api.ts" "src/types/coupons.ts" "src/app/primary-navigation.ts" "src/components/shell/top-navigation.tsx" "src/app/message-media.tsx" "src/components/chats/mobile-chats-app.tsx"

      # The whole frontend suite (npm run test = every test/*.test.mts), so tests for any
      # page, including v2 and Review 15, gate the merge. It replaces a fixed list of files.
      - name: Frontend tests (full suite)
        run: npm run test

      - name: Type error baseline (fails if tsc errors rise)
        run: npm run typecheck:baseline

      - name: Build
        run: npm run build

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Require all application checks
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          echo "Backend: $BACKEND_RESULT"
          echo "Frontend: $FRONTEND_RESULT"
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
