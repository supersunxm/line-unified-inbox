name: Application CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Apply migrations to clean PostgreSQL
        run: npx prisma migrate deploy

      - name: Lint regression scope
        run: npx eslint "src/coupons/**/*.ts" "src/app-version/**/*.ts" "src/mobile/mobile-conversations.service.ts" "src/mobile/mobile-customer-sales-activity.spec.ts" "src/mobile/mobile-video-preview.ts" "src/mobile/mobile-video-preview.spec.ts" "src/conversation-data-contract.ts" "src/conversation-data-contract.spec.ts" "src/purchase-analytics.controller.ts" "src/purchase-analytics.dto.ts" "src/purchase-analytics.service.ts" "src/purchase-analytics.service.spec.ts" "src/purchase-broadcast-audience.dto.ts" "src/purchase-broadcast-audience.service.ts" "src/purchase-broadcast-audience.service.spec.ts" "src/purchase-broadcast-composer.service.spec.ts" "src/mass-message/mass-message.controller.ts" "src/mass-message/mass-message-selected-users-guard.spec.ts" "src/dashboard.controller.ts" "src/dashboard-executive.service.ts" "src/dashboard-executive.service.spec.ts" "src/app.module.ts" "src/line-chat/line-chat-session-health-probe.service.ts" "src/line-chat/line-chat-session-health-probe.spec.ts" "src/line-chat/line-chat-health-probe.cli.ts" "src/line-chat/line-chat-health-probe.cli.spec.ts" "src/line-chat/line-chat-oa-health-probe.service.ts" "src/line-chat/line-chat-oa-health-probe.spec.ts" "src/line-chat/line-chat-oa-health-probe.cli.ts" "src/line-chat/line-chat-oa-health-probe.cli.spec.ts" "src/line-chat/line-chat-operations.controller.ts" "src/line-chat/line-chat-operations-auth.spec.ts" "src/line-chat/line-chat.module.ts" "src/line-chat/line-chat-nickname-worker.module.ts"

      - name: LINE chat health regression tests
        run: npx tsx --test src/line-chat/line-chat-health.spec.ts src/line-chat/line-chat-profile-operation-coordinator.service.spec.ts src/line-chat/line-chat-session-health-probe.spec.ts src/line-chat/line-chat-health-probe.cli.spec.ts src/line-chat/line-chat-oa-health-probe.spec.ts src/line-chat/line-chat-oa-health-probe.cli.spec.ts src/line-chat/line-chat-operations-auth.spec.ts src/line-chat/line-chat-nickname-worker.service.spec.ts src/line-chat/line-chat-recent-resolver.service.spec.ts

      - name: Coupon unit tests
        run: npx tsx --test src/coupons/*.spec.ts

      - name: App version unit tests
        run: npx tsx --test src/app-version/app-version.service.spec.ts

      - name: Conversation data contract regression tests
        run: npx tsx --test src/conversation-data-contract.spec.ts

      - name: Mobile sales audit regression tests
        run: npx tsx --test src/mobile/mobile-customer-sales-activity.spec.ts

      - name: Mobile video preview runtime regression tests
        run: npx tsx --test src/mobile/mobile-video-preview.spec.ts

      - name: Purchase intelligence and broadcast audience regression tests
        run: npx tsx --test src/purchase-analytics.service.spec.ts src/purchase-broadcast-audience.service.spec.ts src/purchase-broadcast-composer.service.spec.ts src/mass-message/mass-message-selected-users-guard.spec.ts

      - name: Executive dashboard regression tests
        run: npx tsx --test src/dashboard-executive.service.spec.ts

      - name: Build
        run: npm run build

      - name: Smoke test backend auth guards
        env:
          NODE_ENV: test
          PORT: 3001
          FRONTEND_URL: http://localhost:3000
          EMAIL_PROVIDER: none
          LINE_WEBHOOK_ENABLED: "false"
          PILOT_MODE: "false"
        run: |
          export LINE_CREDENTIAL_ENCRYPTION_KEY="$(printf '0123456789abcdef0123456789abcdef' | base64 | tr -d '\n')"
          node dist/main.js > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill "$BACKEND_PID" 2>/dev/null || true' EXIT

          HEALTH_CODE="000"
          for attempt in $(seq 1 30); do
            HEALTH_CODE="$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3001/health || true)"
            if [ "$HEALTH_CODE" = "200" ]; then
              break
            fi
            sleep 1
          done

          if [ "$HEALTH_CODE" != "200" ]; then
            cat /tmp/backend.log
            exit 1
          fi

          COUPON_CODE="$(curl -sS -o /tmp/coupon-unauthorized.json -w '%{http_code}' http://127.0.0.1:3001/coupons || true)"
          if [ "$COUPON_CODE" != "401" ]; then
            echo "Expected unauthenticated GET /coupons to return 401, got $COUPON_CODE"
            cat /tmp/coupon-unauthorized.json || true
            cat /tmp/backend.log
            exit 1
          fi

          DASHBOARD_CODE="$(curl -sS -o /tmp/dashboard-unauthorized.json -w '%{http_code}' http://127.0.0.1:3001/dashboard/executive-store-health?period=7d || true)"
          if [ "$DASHBOARD_CODE" != "401" ]; then
            echo "Expected unauthenticated executive dashboard route to return 401, got $DASHBOARD_CODE"
            cat /tmp/dashboard-unauthorized.json || true
            cat /tmp/backend.log
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint regression scope
        run: npx eslint "src/app/coupons/**/*.tsx" "src/app/admin/purchase-analytics/page.tsx" "src/app/mass-messages/page.tsx" "src/app/mass-messages/purchase-broadcast-draft-banner.tsx" "src/app/mass-messages/purchase-broadcast-composer.tsx" "src/app/mass-messages/drafts/[campaignId]/page.tsx" "src/app/dashboard/dashboard-view.tsx" "src/app/dashboard/executive-dashboard-v2.tsx" "src/lib/coupon-api.ts" "src/types/coupons.ts" "src/app/primary-navigation.ts" "src/components/shell/top-navigation.tsx"

      - name: Purchase broadcast audience UI regression tests
        run: node --test --experimental-strip-types test/purchase-broadcast-audience.test.mts test/purchase-broadcast-composer.test.mts

      - name: Executive dashboard UI regression tests
        run: node --test --experimental-strip-types test/dashboard-executive-v2.test.mts

      - name: Build
        run: npm run build

  mobile:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - backend
      - frontend
      - mobile
    runs-on: ubuntu-latest
    steps:
      - name: Require all application checks
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          ANDROID_RESULT: ${{ needs.mobile.result }}
        run: |
          echo "Backend: $BACKEND_RESULT"
          echo "Frontend: $FRONTEND_RESULT"
          echo "Android: $ANDROID_RESULT"
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$ANDROID_RESULT" = "success"
