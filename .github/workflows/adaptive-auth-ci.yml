name: Adaptive Auth CI

on:
  pull_request:
    paths:
      - "frontend/src/lib/authorization.ts"
      - "frontend/test/authorization.test.mts"
      - "frontend/src/components/shell/**"
      - "frontend/src/app/**"
      - "android_app/lib/core/models/authorization_extensions.dart"
      - "android_app/lib/features/shell/**"
      - "android_app/test/authorization_extensions_test.dart"
      - ".github/workflows/adaptive-auth-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-adaptive-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint adaptive auth scope
        run: npx eslint "src/lib/authorization.ts" "test/authorization.test.mts"

      - name: Frontend tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee frontend-test.log
          status=${PIPESTATUS[0]}
          echo "$status" > frontend-test-status.txt
          exit "$status"

      - name: Upload frontend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-auth-frontend-test-diagnostics
          path: |
            frontend/frontend-test.log
            frontend/frontend-test-status.txt
          if-no-files-found: error
          retention-days: 1

      - name: Frontend build
        run: npm run build

  mobile-adaptive-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Adaptive authorization tests
        run: flutter test test/authorization_extensions_test.dart

      - name: Full mobile tests
        run: flutter test
