name: Adaptive Auth CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-adaptive-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint adaptive auth scope
        run: npx eslint "src/lib/authorization.ts" "test/authorization.test.mts"

      # Mandatory Local CI runs the full frontend suite and production build for every PR.
      # Keep the dedicated authorization regression here without repeating those jobs.
      - name: Adaptive authorization regression tests
        run: node --test test/authorization.test.mts
