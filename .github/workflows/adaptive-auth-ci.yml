name: Adaptive Auth CI

on:
  pull_request:
    paths:
      - "frontend/src/lib/authorization.ts"
      - "frontend/test/authorization.test.mts"
      - "frontend/src/components/shell/**"
      - "frontend/src/app/**"
      - ".github/workflows/adaptive-auth-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-adaptive-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint adaptive auth scope
        run: npx eslint "src/lib/authorization.ts" "test/authorization.test.mts"

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build
