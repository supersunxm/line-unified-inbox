name: Finish Android tagging summary hotfix

on:
  push:
    branches:
      - chatgpt/fix-android-tagging-summary-layout-20260912
    paths:
      - .github/workflows/chatgpt-fix-tagging-summary-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-android-tagging-summary-layout-20260912
          fetch-depth: 1

      - name: Apply narrow scoped hotfix
        run: python3 .github/scripts/chatgpt_tagging_summary_hotfix.py

      - name: Ensure diff is scoped
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' android_app/lib/features/chat/chat_page.dart android_app/lib/features/chat/widgets/conversation_tags_sheet.dart android_app/test/tagging_test.dart | sort)"
          test "$changed" = "$expected"
          git diff --stat

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Generate localization
        working-directory: android_app
        run: flutter gen-l10n

      - name: Analyze Android app
        working-directory: android_app
        run: flutter analyze

      - name: Run focused tagging regression tests
        working-directory: android_app
        run: flutter test test/tagging_test.dart test/chat_tags_rehydrate_test.dart

      - name: Run full Flutter test suite
        working-directory: android_app
        run: flutter test

      - name: Commit verified hotfix
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-fix-tagging-summary-hotfix.yml
          rm .github/scripts/chatgpt_tagging_summary_hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            android_app/lib/features/chat/chat_page.dart \
            android_app/lib/features/chat/widgets/conversation_tags_sheet.dart \
            android_app/test/tagging_test.dart \
            .github/workflows/chatgpt-fix-tagging-summary-hotfix.yml \
            .github/scripts/chatgpt_tagging_summary_hotfix.py
          git diff --cached --check
          git commit -m "fix(android): keep saved tagging summary readable"
          git push origin HEAD:chatgpt/fix-android-tagging-summary-layout-20260912
