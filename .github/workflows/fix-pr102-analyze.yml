name: Fix PR 102 analyzer

on:
  push:
    branches:
      - feat/mobile-video-attachment-entry
    paths:
      - .github/workflows/fix-pr102-analyze.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-video-attachment-entry
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Guard BuildContext after async gap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android_app/lib/features/chat/chat_page.dart')
          text = path.read_text()
          old = '''      final length = await picked.length();
      if (length <= 0) {'''
          new = '''      final length = await picked.length();
      if (!mounted) return;
      if (length <= 0) {'''
          if old not in text:
              raise SystemExit('analyzer fix anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify Flutter
        working-directory: android_app
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib/features/chat/chat_page.dart
          flutter analyze
          flutter test
          flutter build apk --debug

      - name: Commit analyzer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android_app/lib/features/chat/chat_page.dart
          git diff --cached --check
          git commit -m "fix(mobile): guard video picker async context"
          git push origin HEAD:feat/mobile-video-attachment-entry
