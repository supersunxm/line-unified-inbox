name: Android Production Release

on:
  push:
    branches:
      - release/android-1.1.3
    paths:
      - android_app/pubspec.yaml
      - .github/workflows/android-production-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Restore permanent signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/lineoppo-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../lineoppo-release.jks
          EOF

      - name: Build signed production APK
        run: >-
          flutter build apk --release
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://line-unified-inbox-production-544f.up.railway.app

      - name: Verify package ID and signing certificate
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"

          PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_CODE="$("$AAPT" dump badging "$APK" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_NAME="$("$AAPT" dump badging "$APK" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          echo "Package ID: $PACKAGE_ID"
          echo "Version: $VERSION_NAME+$VERSION_CODE"
          test "$PACKAGE_ID" = "click.lineoppo.chat"
          test "$VERSION_NAME" = "1.1.3"
          test "$VERSION_CODE" = "23"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          EXPECTED_CERT_SHA256="e244a89876388b015bbd10abe39326aab15da2e1ec0fe0d6a8248855126af114"
          ACTUAL_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p; s/^V2 Signer: certificate SHA-256 digest: //p' /tmp/apk-signature.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          echo "Certificate SHA-256: $ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Rename release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/oppo-line-oa-chat-v1.1.3-production.apk

      - name: Stage signed APK in release branch
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/oppo-line-oa-chat-v1.1.3-production.apk"
          DEST="../frontend/public/downloads/oppo-line-oa-chat-v1.1.3-production.apk"
          mkdir -p ../frontend/public/downloads
          cp "$APK" "$DEST"
          SHA256="$(sha256sum "$DEST" | awk '{print $1}')"
          BYTES="$(stat -c%s "$DEST")"
          echo "Release SHA-256: $SHA256"
          echo "Release bytes: $BYTES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "chore(android): stage signed 1.1.3 APK [skip release-build]"
          git push origin "HEAD:${RELEASE_BRANCH}"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: oppo-line-oa-chat-v1.1.3-production
          path: android_app/build/app/outputs/flutter-apk/oppo-line-oa-chat-v1.1.3-production.apk
          if-no-files-found: error
          retention-days: 30
