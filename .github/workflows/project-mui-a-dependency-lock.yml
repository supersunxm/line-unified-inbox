name: Project MUI A dependency lock

on:
  push:
    branches:
      - feat/mui-pilot-store-chats
    paths:
      - .github/workflows/project-mui-a-dependency-lock.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          ref: feat/mui-pilot-store-chats

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned MUI foundation
        working-directory: frontend
        run: >
          npm install --save-exact
          @mui/material@9.4.0
          @mui/material-nextjs@9.4.0
          @emotion/react@11.14.0
          @emotion/styled@11.14.1
          @emotion/cache@11.14.0

      - name: Commit generated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Project MUI A: install MUI foundation dependencies"
          git push origin HEAD:feat/mui-pilot-store-chats
