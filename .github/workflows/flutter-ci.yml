name: Flutter Mobile CI

on:
  pull_request:
    paths:
      - "android_app/**"
      - ".github/workflows/flutter-ci.yml"
  push:
    branches:
      - main
    paths:
      - "android_app/**"
      - ".github/workflows/flutter-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
