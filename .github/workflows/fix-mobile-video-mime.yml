name: Fix mobile video MIME

on:
  push:
    branches:
      - feat/mobile-video-attachment-entry
    paths:
      - .github/workflows/fix-mobile-video-mime.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-video-attachment-entry
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.2'

      - name: Patch multipart MIME resolver
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android_app/lib/core/network/api_client.dart')
          text = path.read_text()

          old_call = "filename: filename, contentType: _imageMediaType(mimeType, filename)))"
          new_call = "filename: filename, contentType: resolveMultipartMediaType(mimeType, filename)))"
          if old_call not in text:
              raise SystemExit('multipart contentType call anchor not found')
          text = text.replace(old_call, new_call, 1)

          old_method = '''  MediaType? _imageMediaType(String? mimeType, String filename) {
    final supplied = mimeType?.toLowerCase().split(';').first.trim();
    const supported = {'image/jpeg', 'image/png', 'image/gif', 'image/webp'};
    final value = supplied != null && supported.contains(supplied)
        ? supplied
        : switch (filename.toLowerCase().split('.').last) {
            'jpg' || 'jpeg' => 'image/jpeg',
            'png' => 'image/png',
            'gif' => 'image/gif',
            'webp' => 'image/webp',
            _ => null,
          };
    if (value == null) return null;
    final parts = value.split('/');
    return MediaType(parts[0], parts[1]);
  }

'''
          if old_method not in text:
              raise SystemExit('image-only MIME resolver anchor not found')
          text = text.replace(old_method, '', 1)

          class_anchor = 'class ApiClient {'
          resolver = '''MediaType? resolveMultipartMediaType(String? mimeType, String filename) {
  final supplied = mimeType?.toLowerCase().split(';').first.trim();
  const supported = {
    'image/jpeg',
    'image/png',
    'image/gif',
    'image/webp',
    'video/mp4',
  };
  final value = supplied != null && supported.contains(supplied)
      ? supplied
      : switch (filename.toLowerCase().split('.').last) {
          'jpg' || 'jpeg' => 'image/jpeg',
          'png' => 'image/png',
          'gif' => 'image/gif',
          'webp' => 'image/webp',
          'mp4' => 'video/mp4',
          _ => null,
        };
  if (value == null) return null;
  final parts = value.split('/');
  return MediaType(parts[0], parts[1]);
}

'''
          if class_anchor not in text:
              raise SystemExit('ApiClient class anchor not found')
          text = text.replace(class_anchor, resolver + class_anchor, 1)
          path.write_text(text)

          test = Path('android_app/test/api_client_multipart_media_type_test.dart')
          test.write_text('''import 'package:flutter_test/flutter_test.dart';
import 'package:line_oa_chat_hub/core/network/api_client.dart';

void main() {
  group('resolveMultipartMediaType', () {
    test('uses video/mp4 for an explicitly declared MP4 video', () {
      final type = resolveMultipartMediaType('video/mp4', 'clip.mp4');
      expect(type?.type, 'video');
      expect(type?.subtype, 'mp4');
      expect(type.toString(), 'video/mp4');
    });

    test('infers video/mp4 from an MP4 filename', () {
      final type = resolveMultipartMediaType(null, 'customer-video.MP4');
      expect(type.toString(), 'video/mp4');
    });

    test('keeps existing image MIME behavior unchanged', () {
      expect(resolveMultipartMediaType('image/jpeg', 'photo.jpg').toString(),
          'image/jpeg');
      expect(resolveMultipartMediaType(null, 'photo.png').toString(),
          'image/png');
    });

    test('does not accept unsupported video MIME types', () {
      expect(resolveMultipartMediaType('video/quicktime', 'clip.mov'), isNull);
    });
  });
}
''')
          PY

      - name: Verify Android MIME behavior
        working-directory: android_app
        run: |
          flutter pub get
          dart format lib/core/network/api_client.dart test/api_client_multipart_media_type_test.dart
          flutter analyze lib/core/network/api_client.dart test/api_client_multipart_media_type_test.dart
          flutter test test/api_client_multipart_media_type_test.dart

      - name: Commit MIME fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android_app/lib/core/network/api_client.dart android_app/test/api_client_multipart_media_type_test.dart
          git diff --cached --check
          git commit -m "fix(mobile): send video multipart as video/mp4"
          git push origin HEAD:feat/mobile-video-attachment-entry
