                <div className="grid gap-5 lg:grid-cols-[300px_minmax(0,1fr)]">
                  <aside className="rounded-2xl border border-[var(--app-border)] bg-[var(--app-surface)] p-3"><div className="space-y-2">{templates.length===0?<p className="p-4 text-sm text-[var(--app-text-secondary)]">{t.noTemplates}</p>:templates.map(x=><button key={x.id} onClick={()=>setSelectedId(x.id)} className={`w-full rounded-xl border p-3 text-left ${selectedId===x.id?"border-[var(--app-accent)] bg-[var(--app-accent-soft)]":"border-transparent hover:bg-[var(--app-surface-hover)]"}`}><div className="flex items-center justify-between gap-2"><span className="font-semibold">{x.name}</span><span className="text-xs">v{x.version}</span></div><div className="mt-1 flex items-center justify-between text-xs text-[var(--app-text-secondary)]"><span>{x.status==="ACTIVE"?t.active:x.status==="DRAFT"?t.draft:t.inactive}</span><span>{x.assignedStoresCount??0} stores</span></div></button>)}</div></aside>
                  <main className="space-y-5">{selected&&<>
                    <section className="rounded-2xl border border-[var(--app-border)] bg-[var(--app-surface)] p-5"><div className="grid gap-4 md:grid-cols-2"><label className="text-sm">{t.name}<input value={name} onChange={e=>setName(e.target.value)} className="mt-1 w-full rounded-xl border border-[var(--app-border)] bg-[var(--app-bg)] p-3"/></label><label className="text-sm">{t.description}<input value={description} onChange={e=>setDescription(e.target.value)} className="mt-1 w-full rounded-xl border border-[var(--app-border)] bg-[var(--app-bg)] p-3"/></label></div><label className="mt-4 flex items-center gap-2 text-sm"><input type="checkbox" checked={firstOnly} onChange={e=>setFirstOnly(e.target.checked)}/>{t.first}</label></section>
                    <section className="rounded-2xl border border-[var(--app-border)] bg-[var(--app-surface)] p-5"><div className="mb-4 flex items-center justify-between"><h2 className="font-semibold">{t.content}</h2><span className="text-xs text-[var(--app-text-secondary)]">{messages.length} / 5</span></div><input ref={fileRef} type="file" accept="image/jpeg,image/png" className="hidden" onChange={e=>{const f=e.target.files?.[0];e.target.value="";if(f)void upload(f)}}/><div className="space-y-3">{messages.map((m,index)=><div key={m.id} className="rounded-xl border border-[var(--app-border)] bg-[var(--app-bg)] p-4"><div className="mb-2 flex items-center justify-between"><b className="text-sm">{index+1}. {m.type}</b><div className="flex gap-1"><button onClick={()=>move(index,-1)} className="rounded border px-2">↑</button><button onClick={()=>move(index,1)} className="rounded border px-2">↓</button><button onClick={()=>setMessages(messages.filter(x=>x.id!==m.id))} className="rounded border border-red-200 px-2 text-red-600">×</button></div></div>{m.type==="TEXT"?<><textarea value={m.textTemplate} onChange={e=>setMessages(messages.map(x=>x.id===m.id&&x.type==="TEXT"?{...x,textTemplate:e.target.value}:x))} rows={4} className="w-full rounded-xl border border-[var(--app-border)] bg-[var(--app-surface)] p-3"/><div className="mt-2 flex flex-wrap gap-2 text-xs">{["{{user.displayName}}","{{account.name}}","{{store.storeName}}","{{store.googleMapsUrl}}"].map(v=><button key={v} onClick={()=>setMessages(messages.map(x=>x.id===m.id&&x.type==="TEXT"?{...x,textTemplate:x.textTemplate+v}:x))} className="rounded-lg bg-[var(--app-surface-hover)] px-2 py-1">{v}</button>)}</div></>:<div className="flex items-center gap-3">{m.previewUrl&&<img src={m.previewUrl} alt="Greeting" className="h-24 w-24 rounded-xl object-cover"/>}<button onClick={()=>{setImageTarget(m.id);fileRef.current?.click()}} className="rounded-xl border px-3 py-2 text-sm">{m.mediaObjectKey?"เปลี่ยนรูป":"อัปโหลดรูปภาพ"}</button></div>}</div>)}</div><div className="mt-4 flex gap-2"><button disabled={messages.length>=5} onClick={addText} className="rounded-xl border px-3 py-2 text-sm">{t.addText}</button><button disabled={messages.length>=5} onClick={addImage} className="rounded-xl border px-3 py-2 text-sm">{t.addImage}</button></div><div className="mt-5 flex flex-wrap gap-2"><button disabled={busy} onClick={()=>void save()} className="rounded-xl border px-4 py-2 text-sm font-semibold">{t.save}</button>{selected.status!=="ACTIVE"?<button disabled={busy} onClick={()=>void activate()} className="rounded-xl bg-[var(--app-accent)] px-4 py-2 text-sm font-semibold text-white">{t.activate}</button>:<button disabled={busy} onClick={()=>void deactivate()} className="rounded-xl bg-amber-50 px-4 py-2 text-sm font-semibold text-amber-800">{t.deactivate}</button>}<button disabled={busy} onClick={()=>void archive()} className="rounded-xl border px-4 py-2 text-sm">{t.archive}</button></div></section>
                    <section className="grid gap-5 xl:grid-cols-2"><div className="rounded-2xl border border-[var(--app-border)] bg-[var(--app-surface)] p-5"><h2 className="font-semibold">{t.preview}</h2><div className="mt-3 grid gap-3 sm:grid-cols-2"><select value={previewStore} onChange={e=>setPreviewStore(e.target.value)} className="rounded-xl border border-[var(--app-border)] bg-[var(--app-bg)] p-2 text-sm"><option value="">-</option>{readiness?.items.map(i=><option key={i.lineOfficialAccountId} value={i.lineOfficialAccountId}>{i.storeName}</option>)}</select><input value={sampleName} onChange={e=>setSampleName(e.target.value)} placeholder={t.sample} className="rounded-xl border border-[var(--app-border)] bg-[var(--app-bg)] p-2 text-sm"/></div><div className="mt-4 space-y-2 rounded-2xl bg-[var(--app-bg)] p-4">{preview?.messages?.map((m:any)=><div key={m.id}>{m.type==="IMAGE"?<img src={m.previewUrl||m.imageUrl} alt="Preview" className="max-h-52 rounded-xl"/>:<div className="whitespace-pre-wrap rounded-xl bg-white p-3 text-sm shadow-sm">{m.resolvedText}</div>}</div>)}</div></div><div className="rounded-2xl border border-[var(--app-border)] bg-[var(--app-surface)] p-5"><h2 className="font-semibold">Summary</h2><div className="mt-4 grid grid-cols-3 gap-2 text-center"><div className="rounded-xl bg-[var(--app-bg)] p-3"><b>{readiness?.summary.ready??0}</b><div className="text-xs">{t.ready}</div></div><div className="rounded-xl bg-[var(--app-bg)] p-3"><b>{readiness?.summary.blocked??0}</b><div className="text-xs">{t.blocked}</div></div><div className="rounded-xl bg-[var(--app-bg)] p-3"><b>{storeIds.length}</b><div className="text-xs">Selected</div></div></div><p className="mt-4 text-xs text-[var(--app-text-secondary)]">{t.native}</p></div></section>
                    <section className="rounded-2xl border border-[var(--app-border)] bg-[var(--app-surface)] p-5"><div className="flex flex-wrap items-center justify-between gap-3"><h2 className="font-semibold">{t.stores}</h2><div className="flex gap-2"><button onClick={()=>setStoreIds(readyIds)} className="rounded-xl border px-3 py-2 text-sm">{t.selectReady}</button><button onClick={()=>setStoreIds([])} className="rounded-xl border px-3 py-2 text-sm">{t.clear}</button><button disabled={busy} onClick={()=>void apply()} className="rounded-xl bg-[var(--app-accent)] px-3 py-2 text-sm font-semibold text-white">{t.apply} ({storeIds.length})</button></div></div><div className="mt-4 max-h-[480px] overflow-auto rounded-xl border border-[var(--app-border)]"><table className="w-full text-sm"><thead className="sticky top-0 bg-[var(--app-surface)]"><tr><th className="p-3 text-left">✓</th><th className="p-3 text-left">Store ID</th><th className="p-3 text-left">Store</th><th className="p-3 text-left">LINE OA</th><th className="p-3 text-left">Province</th><th className="p-3 text-left">Status</th><th className="p-3 text-left">{t.assigned}</th></tr></thead><tbody>{readiness?.items.map(i=><tr key={i.lineOfficialAccountId} className="border-t border-[var(--app-border)]"><td className="p-3"><input type="checkbox" disabled={i.readinessStatus!=="READY"} checked={storeIds.includes(i.lineOfficialAccountId)} onChange={e=>setStoreIds(current=>e.target.checked?[...current,i.lineOfficialAccountId]:current.filter(x=>x!==i.lineOfficialAccountId))}/></td><td className="p-3">{i.externalStoreId||"—"}</td><td className="p-3 font-medium">{i.storeName}</td><td className="p-3">{i.lineOfficialAccountName}</td><td className="p-3">{i.province||"—"}</td><td className="p-3"><span className={i.readinessStatus==="READY"?"text-emerald-600":"text-amber-600"}>{i.readinessStatus==="READY"?t.ready:t.blocked}</span>{i.readinessReason&&<div className="text-xs text-[var(--app-text-secondary)]">{i.readinessReason}</div>}</td><td className="p-3">{i.currentGreeting?.templateName||"—"}</td></tr>)}</tbody></table></div></section>
                  </>}</main>
                </div>
              </div>
            </div>;
          }
          EOF

          cat > frontend/test/greeting-messages.test.mts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { readFileSync } from "node:fs";
          const view=readFileSync(new URL("../src/app/greeting-messages/greeting-messages-view.tsx", import.meta.url),"utf8");
          const nav=readFileSync(new URL("../src/components/shell/app-sidebar.tsx", import.meta.url),"utf8");
          test("Greeting Manager exposes one store checkbox and all-ready assignment",()=>{ assert.match(view,/selectReady/); assert.match(view,/type="checkbox"/); assert.match(view,/assignGreetingMessage/); });
          test("Greeting Manager supports TEXT IMAGE and first-time policy",()=>{ assert.match(view,/addText/); assert.match(view,/addImage/); assert.match(view,/FIRST_TIME_ONLY/); });
          test("Greeting nav is separate from Rich Menu and Auto-response",()=>{ assert.match(nav,/\/greeting-messages/); });
          EOF

          python <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f"anchor missing in {path}: {old[:120]}")
              p.write_text(s.replace(old,new,1))

          # Frontend public types
          p=Path('frontend/src/types/api.ts'); s=p.read_text(); s += r'''

          export type GreetingMessageBlock =
            | { id: string; type: "TEXT"; textTemplate: string }
            | { id: string; type: "IMAGE"; mediaObjectKey: string; previewObjectKey?: string; imageUrl?: string; previewUrl?: string; fileName?: string; fileSize?: number; width?: number; height?: number };
          export type GreetingTemplate = {
            id: string; name: string; description: string | null; status: "DRAFT" | "ACTIVE" | "INACTIVE" | "ARCHIVED";
            sendPolicy: "FIRST_TIME_ONLY" | "ADD_AND_UNBLOCK"; version: number; messages: GreetingMessageBlock[];
            assignedStoresCount?: number; assignedLineOfficialAccountIds?: string[]; executionCount?: number; updatedAt: string;
          };
          export type GreetingReadinessItem = { lineOfficialAccountId: string; lineOfficialAccountName: string; storeId: string | null; externalStoreId: string | null; storeName: string; province: string | null; readinessStatus: "READY" | "BLOCKED"; readinessReason: string | null; selected: boolean; currentGreeting: { templateId: string; templateName: string; templateVersion: number } | null };
          export type GreetingReadiness = { templateId: string; usedVariables: string[]; summary: { total: number; ready: number; blocked: number; selected: number }; items: GreetingReadinessItem[] };
          export type GreetingUploadMediaResult = { mediaObjectKey: string; previewObjectKey: string; imageUrl: string; previewUrl: string; mimeType: string; fileSize: number; width?: number; height?: number };
          '''
          p.write_text(s)

          # API methods before final object close.
          p=Path('frontend/src/lib/api.ts'); s=p.read_text()
          anchor='''  previewAutoResponse: (id: string, body?: { lineOfficialAccountId?: string; storeId?: string }) =>\n    request<import("@/types/api").AutoResponsePreviewResult>(\n      `/auto-responses/${encodeURIComponent(id)}/preview`,\n      {\n        method: "POST",\n        body: JSON.stringify(body || {}),\n      },\n    ),\n};'''
          add='''  previewAutoResponse: (id: string, body?: { lineOfficialAccountId?: string; storeId?: string }) =>\n    request<import("@/types/api").AutoResponsePreviewResult>(\n      `/auto-responses/${encodeURIComponent(id)}/preview`,\n      { method: "POST", body: JSON.stringify(body || {}) },\n    ),\n  listGreetingMessages: () => request<import("@/types/api").GreetingTemplate[]>("/greeting-messages"),\n  createGreetingMessage: (data: any) => request<import("@/types/api").GreetingTemplate>("/greeting-messages", { method: "POST", body: JSON.stringify(data) }),\n  updateGreetingMessage: (id: string, data: any) => request<import("@/types/api").GreetingTemplate>(`/greeting-messages/${encodeURIComponent(id)}`, { method: "PATCH", body: JSON.stringify(data) }),\n  activateGreetingMessage: (id: string) => request<import("@/types/api").GreetingTemplate>(`/greeting-messages/${encodeURIComponent(id)}/activate`, { method: "POST" }),\n  deactivateGreetingMessage: (id: string) => request<import("@/types/api").GreetingTemplate>(`/greeting-messages/${encodeURIComponent(id)}/deactivate`, { method: "POST" }),\n  archiveGreetingMessage: (id: string) => request<import("@/types/api").GreetingTemplate>(`/greeting-messages/${encodeURIComponent(id)}/archive`, { method: "POST" }),\n  getGreetingReadiness: (id: string) => request<import("@/types/api").GreetingReadiness>(`/greeting-messages/${encodeURIComponent(id)}/readiness`),\n  assignGreetingMessage: (id: string, lineOfficialAccountIds: string[]) => request<{ templateId: string; assignedCount: number; assignedLineOfficialAccountIds: string[] }>(`/greeting-messages/${encodeURIComponent(id)}/assignments`, { method: "POST", body: JSON.stringify({ lineOfficialAccountIds }) }),\n  previewGreetingMessage: (id: string, body: { lineOfficialAccountId?: string; sampleUserDisplayName?: string }) => request<any>(`/greeting-messages/${encodeURIComponent(id)}/preview`, { method: "POST", body: JSON.stringify(body || {}) }),\n  uploadGreetingMedia: (file: File) => { const formData = new FormData(); formData.append("file", file); return request<import("@/types/api").GreetingUploadMediaResult>("/greeting-messages/media", { method: "POST", body: formData }); },\n};'''
          if anchor not in s: raise SystemExit('api end anchor missing')
          p.write_text(s.replace(anchor,add,1))

          replace_once('frontend/src/app/primary-navigation.ts', '| "auto-responses";', '| "auto-responses" | "greeting-messages";')
          replace_once('frontend/src/lib/authorization.ts', '    case "auto-responses":\n      return hasBackendAdminAccess(auth);', '    case "auto-responses":\n    case "greeting-messages":\n      return hasBackendAdminAccess(auth);')

          p=Path('frontend/src/components/shell/app-sidebar.tsx'); s=p.read_text()
          s=s.replace('| "auto-response" | "profile"', '| "auto-response" | "greeting" | "profile"',1)
          s=s.replace('{name === "auto-response" && <><path', '{name === "greeting" && <><path {...common} d="M4 5h16v14H4z"/><path {...common} d="M8 9h8M8 13h5"/><path {...common} d="M12 2v3"/></>}\n      {name === "auto-response" && <><path',1)
          s=s.replace('autoResponses: "ข้อความตอบกลับอัตโนมัติ",', 'autoResponses: "ข้อความตอบกลับอัตโนมัติ", greetingMessages: "ข้อความต้อนรับ",',1)
          s=s.replace('autoResponses: "自动回复",', 'autoResponses: "自动回复", greetingMessages: "欢迎消息",',1)
          s=s.replace('autoResponses: "Auto-response",', 'autoResponses: "Auto-response", greetingMessages: "Greeting messages",',1)
          s=s.replace('{ href: "/auto-responses", label: t.autoResponses, icon: "auto-response", section: "auto-responses" },', '{ href: "/auto-responses", label: t.autoResponses, icon: "auto-response", section: "auto-responses" },\n    { href: "/greeting-messages", label: t.greetingMessages, icon: "greeting", section: "greeting-messages" },',1)
          p.write_text(s)

          p=Path('frontend/src/app/page.tsx'); s=p.read_text()
          s=s.replace('import { AutoResponsesView } from "./auto-responses/auto-responses-view";', 'import { AutoResponsesView } from "./auto-responses/auto-responses-view";\nimport { GreetingMessagesView } from "./greeting-messages/greeting-messages-view";',1)
          anchor='''          ) : initialSection === "stores" ? ('''
          insert='''          ) : initialSection === "greeting-messages" ? (\n            <section className="col-span-full min-h-0 overflow-y-auto">\n              <GreetingMessagesView language={language} />\n            </section>\n          ) : initialSection === "stores" ? ('''
          if anchor not in s: raise SystemExit('page section anchor missing')
          p.write_text(s.replace(anchor,insert,1))
          PY

          npx --prefix backend prisma validate --schema backend/prisma/schema.prisma
          npx --prefix backend prisma generate --schema backend/prisma/schema.prisma

