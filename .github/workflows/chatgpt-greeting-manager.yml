name: ChatGPT Greeting Manager

on:
  push:
    branches:
      - chatgpt/greeting-manager

permissions:
  contents: write

jobs:
  implement-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Implement Greeting Message Manager
        shell: bash
        run: |
          mkdir -p backend/src/greeting backend/prisma/migrations/20260827103000_add_greeting_messages frontend/src/app/greeting-messages

          cat > backend/src/greeting/greeting.types.ts <<'EOF'
          import type { AutoResponseMessageBlock } from "../auto-response/auto-response.types";
          import type { GreetingSendPolicy, GreetingTemplateStatus } from "@prisma/client";

          export type GreetingMessageBlock = AutoResponseMessageBlock;
          export type CreateGreetingTemplateDto = {
            name: string;
            description?: string | null;
            sendPolicy?: GreetingSendPolicy;
            messages?: GreetingMessageBlock[];
          };
          export type UpdateGreetingTemplateDto = Partial<CreateGreetingTemplateDto> & {
            status?: GreetingTemplateStatus;
          };
          export type GreetingPreviewDto = {
            lineOfficialAccountId?: string;
            sampleUserDisplayName?: string;
          };
          export type GreetingAssignmentsDto = { lineOfficialAccountIds: string[] };
          EOF

          cat > backend/src/greeting/greeting.service.ts <<'EOF'
          import {
            BadRequestException,
            Injectable,
            NotFoundException,
            Optional,
            ServiceUnavailableException,
          } from "@nestjs/common";
          import { GreetingSendPolicy, GreetingTemplateStatus, Prisma } from "@prisma/client";
          import { randomUUID } from "node:crypto";
          import sharp from "sharp";
          import { PrismaService } from "../prisma.service";
          import { AuditLogService } from "../auth/audit-log.service";
          import type { AuthUser } from "../auth/auth.guard";
          import { MediaStorageService } from "../media/media-storage";
          import { createMediaPublicUrl } from "../media/media-public-url";
          import {
            detectImageMime,
            IMAGE_EXTENSIONS,
            validateAutoResponseMessages,
          } from "../auto-response/auto-response.utils";
          import type { AutoResponseMessageBlock } from "../auto-response/auto-response.types";
          import {
            extractTemplateVariables,
            getStoreVariableValue,
            isValidGoogleMapsUrl,
            resolveTemplateVariables,
            type StoreVariableContext,
          } from "../store-master/template-variable-resolver";
          import type {
            CreateGreetingTemplateDto,
            GreetingAssignmentsDto,
            GreetingMessageBlock,
            GreetingPreviewDto,
            UpdateGreetingTemplateDto,
          } from "./greeting.types";

          const USER_DISPLAY_NAME = "user.displayName";
          const ACCOUNT_NAME = "account.name";

          @Injectable()
          export class GreetingService {
            constructor(
              private readonly prisma: PrismaService,
              @Optional() private readonly auditLog?: AuditLogService,
              @Optional() private readonly media?: MediaStorageService,
            ) {}

            private messagesFrom(template: { contentJson: unknown }): GreetingMessageBlock[] {
              const json = template.contentJson as { messages?: GreetingMessageBlock[] } | null;
              return Array.isArray(json?.messages) ? json!.messages! : [];
            }

            private enrich(messages: GreetingMessageBlock[]) {
              return messages.map((message) => message.type === "IMAGE" ? {
                ...message,
                imageUrl: createMediaPublicUrl(message.mediaObjectKey),
                previewUrl: createMediaPublicUrl(message.previewObjectKey || message.mediaObjectKey),
              } : message);
            }

            private storeContext(oa: any): StoreVariableContext {
              const store = oa.store;
              const master = store?.storeMaster;
              return {
                id: store?.id,
                name: store?.name,
                storeName: store?.name || master?.storeName,
                code: store?.code,
                storeId: master?.externalStoreId || store?.code,
                externalStoreId: master?.externalStoreId,
                accountName: master?.accountName || oa.name,
                province: master?.province || store?.area,
                region: master?.region || store?.region,
                lineId: master?.lineId,
                lineOaLink: master?.lineOaLink,
                lineManagerUrl: master?.lineManagerUrl,
                tiktokUsername: master?.tiktokUsername,
                tiktokProfileUrl: master?.tiktokProfileUrl,
                googleMapsUrl: master?.googleMapsUrl,
              };
            }

            private usedVariables(messages: GreetingMessageBlock[]) {
              const vars = new Set<string>();
              for (const message of messages) {
                if (message.type !== "TEXT") continue;
                extractTemplateVariables(message.textTemplate).forEach((item) => vars.add(item));
              }
              return [...vars];
            }

            private readiness(messages: GreetingMessageBlock[], store: StoreVariableContext) {
              const missing: string[] = [];
              for (const variable of this.usedVariables(messages)) {
                if (variable === USER_DISPLAY_NAME || variable === ACCOUNT_NAME) continue;
                const value = getStoreVariableValue(variable, store);
                const prop = variable.startsWith("store.") ? variable.slice(6) : variable;
                if (!value || (prop === "googleMapsUrl" && !isValidGoogleMapsUrl(value))) missing.push(variable);
              }
              return { ready: missing.length === 0, missingVariables: missing };
            }

            async uploadMedia(file: { buffer: Buffer; mimetype?: string; size?: number }) {
              if (!file?.buffer?.length) throw new BadRequestException("Image file is required");
              if (file.buffer.length > 10 * 1024 * 1024) throw new BadRequestException("Image must not exceed 10 MB");
              const mime = detectImageMime(file.buffer);
              if (!mime || !IMAGE_EXTENSIONS[mime]) throw new BadRequestException("รองรับเฉพาะไฟล์ JPG และ PNG");
              if (!this.media) throw new ServiceUnavailableException("Media storage is unavailable");

              const ext = IMAGE_EXTENSIONS[mime];
              const id = randomUUID();
              const originalObjectKey = `line-media/greeting/${id}-original.${ext}`;
              await this.media.put(originalObjectKey, file.buffer, mime);

              const metadata = await sharp(file.buffer).metadata();
              let previewMime: "image/jpeg" | "image/png" = mime;
              let previewExt = ext;
              let preview = mime === "image/jpeg"
                ? await sharp(file.buffer).resize({ width: 1024, height: 1024, fit: "inside", withoutEnlargement: true }).jpeg({ quality: 80 }).toBuffer()
                : await sharp(file.buffer).resize({ width: 1024, height: 1024, fit: "inside", withoutEnlargement: true }).png({ compressionLevel: 8 }).toBuffer();
              if (preview.length > 1024 * 1024) {
                preview = await sharp(file.buffer).resize({ width: 900, height: 900, fit: "inside", withoutEnlargement: true }).jpeg({ quality: 72 }).toBuffer();
                previewMime = "image/jpeg";
                previewExt = "jpg";
              }
              if (preview.length > 1024 * 1024) throw new BadRequestException("Preview image exceeds 1 MB");
              const previewObjectKey = `line-media/greeting/${id}-preview.${previewExt}`;
              await this.media.put(previewObjectKey, preview, previewMime);
              return {
                mediaObjectKey: originalObjectKey,
                previewObjectKey,
                imageUrl: createMediaPublicUrl(originalObjectKey),
                previewUrl: createMediaPublicUrl(previewObjectKey),
                mimeType: mime,
                fileSize: file.buffer.length,
                width: metadata.width,
                height: metadata.height,
              };
            }

            async listTemplates(query?: { status?: GreetingTemplateStatus; search?: string }) {
              const where: Prisma.GreetingTemplateWhereInput = {};
              where.status = query?.status || { not: GreetingTemplateStatus.ARCHIVED };
              if (query?.search?.trim()) {
                where.OR = [
                  { name: { contains: query.search.trim(), mode: "insensitive" } },
                  { description: { contains: query.search.trim(), mode: "insensitive" } },
                ];
              }
              const templates = await this.prisma.greetingTemplate.findMany({
                where,
                include: { _count: { select: { assignments: true, executions: true } } },
                orderBy: { updatedAt: "desc" },
              });
              return templates.map((template) => ({
                ...template,
                messages: this.enrich(this.messagesFrom(template)),
                assignedStoresCount: template._count.assignments,
                executionCount: template._count.executions,
                _count: undefined,
              }));
            }

            async getTemplate(id: string) {
              const template = await this.prisma.greetingTemplate.findUnique({
                where: { id },
                include: { assignments: { select: { lineOfficialAccountId: true } }, _count: { select: { executions: true } } },
              });
              if (!template) throw new NotFoundException("Greeting template not found");
              return {
                ...template,
                messages: this.enrich(this.messagesFrom(template)),
                assignedLineOfficialAccountIds: template.assignments.map((item) => item.lineOfficialAccountId),
                executionCount: template._count.executions,
                assignments: undefined,
                _count: undefined,
              };
            }

            async createTemplate(dto: CreateGreetingTemplateDto, user: AuthUser) {
              const name = dto.name?.trim();
              if (!name) throw new BadRequestException("Greeting template name is required");
              const messages = dto.messages?.length ? dto.messages.map((message) => ({ ...message, id: message.id || randomUUID() })) : [{ id: randomUUID(), type: "TEXT" as const, textTemplate: "" }];
              const created = await this.prisma.greetingTemplate.create({ data: {
                name,
                description: dto.description?.trim() || null,
                sendPolicy: dto.sendPolicy || GreetingSendPolicy.FIRST_TIME_ONLY,
                contentJson: { version: 1, messages } as unknown as Prisma.InputJsonValue,
                createdByUserId: user.id,
              }});
              await this.auditLog?.record({ actorUserId: user.id, action: "GREETING_CREATED", metadata: { templateId: created.id } });
              return this.getTemplate(created.id);
            }

            async updateTemplate(id: string, dto: UpdateGreetingTemplateDto, user: AuthUser) {
              const existing = await this.prisma.greetingTemplate.findUnique({ where: { id } });
              if (!existing) throw new NotFoundException("Greeting template not found");
              const existingMessages = this.messagesFrom(existing);
              const messages = dto.messages === undefined ? existingMessages : dto.messages.map((message) => ({ ...message, id: message.id || randomUUID() }));
              if (messages.length > 5) throw new BadRequestException("Greeting cannot exceed 5 messages");
              const meaningfulChange = dto.messages !== undefined || dto.sendPolicy !== undefined;
              await this.prisma.greetingTemplate.update({ where: { id }, data: {
                name: dto.name !== undefined ? dto.name.trim() : existing.name,
                description: dto.description !== undefined ? dto.description?.trim() || null : existing.description,
                sendPolicy: dto.sendPolicy ?? existing.sendPolicy,
                contentJson: { version: 1, messages } as unknown as Prisma.InputJsonValue,
                ...(meaningfulChange ? { version: { increment: 1 } } : {}),
              }});
              await this.auditLog?.record({ actorUserId: user.id, action: "GREETING_UPDATED", metadata: { templateId: id } });
              return this.getTemplate(id);
            }

            async activateTemplate(id: string, user: AuthUser) {
              const template = await this.prisma.greetingTemplate.findUnique({ where: { id } });
              if (!template) throw new NotFoundException("Greeting template not found");
              const messages = this.messagesFrom(template);
              const validation = validateAutoResponseMessages(messages as AutoResponseMessageBlock[]);
              if (!validation.valid) throw new BadRequestException(validation.errors.join("; "));
              await this.prisma.greetingTemplate.update({ where: { id }, data: { status: GreetingTemplateStatus.ACTIVE, activatedAt: new Date(), archivedAt: null } });
              await this.auditLog?.record({ actorUserId: user.id, action: "GREETING_ACTIVATED", metadata: { templateId: id } });
              return this.getTemplate(id);
            }

            async deactivateTemplate(id: string, user: AuthUser) {
              await this.getTemplate(id);
              await this.prisma.greetingTemplate.update({ where: { id }, data: { status: GreetingTemplateStatus.INACTIVE } });
              await this.auditLog?.record({ actorUserId: user.id, action: "GREETING_DEACTIVATED", metadata: { templateId: id } });
              return this.getTemplate(id);
            }

            async archiveTemplate(id: string, user: AuthUser) {
              await this.getTemplate(id);
              await this.prisma.greetingTemplate.update({ where: { id }, data: { status: GreetingTemplateStatus.ARCHIVED, archivedAt: new Date() } });
              await this.auditLog?.record({ actorUserId: user.id, action: "GREETING_ARCHIVED", metadata: { templateId: id } });
              return this.getTemplate(id);
            }

            async evaluateReadiness(id: string) {
              const template = await this.prisma.greetingTemplate.findUnique({ where: { id } });
              if (!template) throw new NotFoundException("Greeting template not found");
              const messages = this.messagesFrom(template);
              const oas = await this.prisma.lineOfficialAccount.findMany({
                where: { accountType: "STORE", isActive: true, archivedAt: null, storeId: { not: null } },
                include: { store: { include: { storeMaster: true } }, greetingAssignment: { include: { template: true } } },
                orderBy: { name: "asc" },
              });
              const items = oas.map((oa) => {
                const store = this.storeContext(oa);
                const variableState = this.readiness(messages, store);
                const ready = Boolean(oa.encryptedChannelAccessToken) && variableState.ready;
                return {
                  lineOfficialAccountId: oa.id,
                  lineOfficialAccountName: oa.name,
                  storeId: oa.store?.id || null,
                  externalStoreId: oa.store?.storeMaster?.externalStoreId || null,
                  storeName: oa.store?.name || oa.name,
                  province: oa.store?.storeMaster?.province || oa.store?.area || null,
                  readinessStatus: ready ? "READY" : "BLOCKED",
                  readinessReason: !oa.encryptedChannelAccessToken ? "Missing Channel Access Token" : (variableState.ready ? null : `Missing ${variableState.missingVariables.join(", ")}`),
                  selected: oa.greetingAssignment?.templateId === id,
                  currentGreeting: oa.greetingAssignment ? {
                    templateId: oa.greetingAssignment.templateId,
                    templateName: oa.greetingAssignment.template.name,
                    templateVersion: oa.greetingAssignment.template.version,
                  } : null,
                };
              });
              return {
                templateId: id,
                usedVariables: this.usedVariables(messages),
                summary: {
                  total: items.length,
                  ready: items.filter((item) => item.readinessStatus === "READY").length,
                  blocked: items.filter((item) => item.readinessStatus === "BLOCKED").length,
                  selected: items.filter((item) => item.selected).length,
                },
                items,
              };
            }

            async saveAssignments(id: string, dto: GreetingAssignmentsDto, user: AuthUser) {
              await this.getTemplate(id);
              const readiness = await this.evaluateReadiness(id);
              const readyIds = new Set(readiness.items.filter((item) => item.readinessStatus === "READY").map((item) => item.lineOfficialAccountId));
              const requested = [...new Set(dto.lineOfficialAccountIds || [])];
              const invalid = requested.filter((oaId) => !readyIds.has(oaId));
              if (invalid.length) throw new BadRequestException(`Some stores are not ready: ${invalid.join(", ")}`);
              await this.prisma.$transaction(async (tx) => {
                await tx.greetingStoreAssignment.deleteMany({ where: { templateId: id, lineOfficialAccountId: { notIn: requested } } });
                for (const lineOfficialAccountId of requested) {
                  await tx.greetingStoreAssignment.upsert({
                    where: { lineOfficialAccountId },
                    create: { templateId: id, lineOfficialAccountId },
                    update: { templateId: id },
                  });
                }
              });
              await this.auditLog?.record({ actorUserId: user.id, action: "GREETING_ASSIGNMENTS_UPDATED", metadata: { templateId: id, assignedCount: requested.length } });
              return { templateId: id, assignedCount: requested.length, assignedLineOfficialAccountIds: requested };
            }

            async previewTemplate(id: string, dto?: GreetingPreviewDto) {
              const template = await this.prisma.greetingTemplate.findUnique({ where: { id } });
              if (!template) throw new NotFoundException("Greeting template not found");
              const oa = dto?.lineOfficialAccountId ? await this.prisma.lineOfficialAccount.findUnique({
                where: { id: dto.lineOfficialAccountId }, include: { store: { include: { storeMaster: true } } },
              }) : await this.prisma.lineOfficialAccount.findFirst({
                where: { accountType: "STORE", isActive: true, archivedAt: null, storeId: { not: null } }, include: { store: { include: { storeMaster: true } } }, orderBy: { name: "asc" },
              });
              if (!oa) throw new NotFoundException("No store LINE OA available for preview");
              const store = this.storeContext(oa);
              const sampleName = dto?.sampleUserDisplayName?.trim() || "Sunn";
              const messages = this.messagesFrom(template);
              const state = this.readiness(messages, store);
              const resolved = this.enrich(messages).map((message) => {
                if (message.type === "IMAGE") return message;
                let text = message.textTemplate.replace(/\{\{\s*user\.displayName\s*\}\}/g, sampleName).replace(/\{\{\s*account\.name\s*\}\}/g, oa.name);
                text = resolveTemplateVariables(text, store);
                return { ...message, resolvedText: text };
              });
              return { templateId: id, lineOfficialAccountId: oa.id, storeName: oa.store?.name || oa.name, ready: state.ready, missingVariables: state.missingVariables, messages: resolved };
            }
          }
          EOF

          cat > backend/src/greeting/greeting-execution.service.ts <<'EOF'
          import { Injectable, Logger } from "@nestjs/common";
          import { GreetingExecutionStatus, GreetingSendPolicy, GreetingTemplateStatus } from "@prisma/client";
          import { createHash } from "node:crypto";
          import { PrismaService } from "../prisma.service";
          import { CredentialEncryptionService } from "../credentials/credential-encryption.service";
          import { LineMessagingService } from "../line-messaging/line-messaging.service";
          import { LineProfileService } from "../line-profile.service";
          import { MediaStorageService } from "../media/media-storage";
          import { createMediaPublicUrl } from "../media/media-public-url";
          import { getFriendAttributionHashSecret, hashLineUserId } from "../friend-source-links/friend-attribution.config";
          import { extractTemplateVariables, getStoreVariableValue, isValidGoogleMapsUrl, resolveTemplateVariables, type StoreVariableContext } from "../store-master/template-variable-resolver";
          import type { GreetingMessageBlock } from "./greeting.types";

          export function shouldSendGreeting(policy: GreetingSendPolicy, isUnblocked: boolean, hasPriorSuccess: boolean) {
            if (policy === GreetingSendPolicy.FIRST_TIME_ONLY && isUnblocked) return false;
            if (policy === GreetingSendPolicy.FIRST_TIME_ONLY && hasPriorSuccess) return false;
            return true;
          }

          @Injectable()
          export class GreetingExecutionService {
            private readonly logger = new Logger(GreetingExecutionService.name);
            constructor(
              private readonly prisma: PrismaService,
              private readonly encryption: CredentialEncryptionService,
              private readonly messaging: LineMessagingService,
              private readonly profiles: LineProfileService,
              private readonly media: MediaStorageService,
            ) {}

            private hashUser(userId: string) {
              try { return hashLineUserId(userId, getFriendAttributionHashSecret()); }
              catch { return createHash("sha256").update(userId).digest("hex"); }
            }

            private messages(template: any): GreetingMessageBlock[] {
              const json = template.contentJson as { messages?: GreetingMessageBlock[] } | null;
              return Array.isArray(json?.messages) ? json!.messages! : [];
            }

            private storeContext(oa: any): StoreVariableContext {
              const store = oa.store;
              const master = store?.storeMaster;
              return {
                name: store?.name,
                storeName: store?.name || master?.storeName,
                storeId: master?.externalStoreId || store?.code,
                externalStoreId: master?.externalStoreId,
                accountName: master?.accountName || oa.name,
                province: master?.province || store?.area,
                region: master?.region || store?.region,
                lineId: master?.lineId,
                lineOaLink: master?.lineOaLink,
                lineManagerUrl: master?.lineManagerUrl,
                tiktokUsername: master?.tiktokUsername,
                tiktokProfileUrl: master?.tiktokProfileUrl,
                googleMapsUrl: master?.googleMapsUrl,
              };
            }

            private async record(input: any) {
              try { await this.prisma.greetingExecution.create({ data: input }); }
              catch (error) { this.logger.warn(`Greeting execution log failed: ${error instanceof Error ? error.message : String(error)}`); }
            }

            async handleFollow(params: { lineOfficialAccountId: string; lineUserId: string; replyToken?: string; webhookEventId?: string; isUnblocked?: boolean }) {
              const { lineOfficialAccountId, lineUserId, replyToken, webhookEventId } = params;
              const isUnblocked = Boolean(params.isUnblocked);
              const lineUserIdHash = this.hashUser(lineUserId);
              const assignment = await this.prisma.greetingStoreAssignment.findUnique({
                where: { lineOfficialAccountId },
                include: { template: true, lineOfficialAccount: { include: { store: { include: { storeMaster: true } } } } },
              });
              if (!assignment) return { status: "SKIPPED", reason: "NO_ASSIGNMENT" };
              const template = assignment.template;
              const oa = assignment.lineOfficialAccount;
              const baseLog = { templateId: template.id, lineOfficialAccountId, webhookEventId: webhookEventId || null, lineUserIdHash, isUnblocked };
              if (oa.accountType !== "STORE" || !oa.isActive || oa.archivedAt) {
                await this.record({ ...baseLog, status: GreetingExecutionStatus.SKIPPED, reason: "OA_NOT_ELIGIBLE" });
                return { status: "SKIPPED", reason: "OA_NOT_ELIGIBLE" };
              }
              if (template.status !== GreetingTemplateStatus.ACTIVE) {
                await this.record({ ...baseLog, status: GreetingExecutionStatus.SKIPPED, reason: "TEMPLATE_NOT_ACTIVE" });
                return { status: "SKIPPED", reason: "TEMPLATE_NOT_ACTIVE" };
              }
              const prior = template.sendPolicy === GreetingSendPolicy.FIRST_TIME_ONLY
                ? await this.prisma.greetingExecution.findFirst({ where: { lineOfficialAccountId, lineUserIdHash, status: GreetingExecutionStatus.SUCCESS } })
                : null;
              if (!shouldSendGreeting(template.sendPolicy, isUnblocked, Boolean(prior))) {
                await this.record({ ...baseLog, status: GreetingExecutionStatus.SKIPPED, reason: isUnblocked ? "UNBLOCK_SKIPPED" : "ALREADY_GREETED" });
                return { status: "SKIPPED" };
              }
              if (!replyToken) {
                await this.record({ ...baseLog, status: GreetingExecutionStatus.FAILED, reason: "MISSING_REPLY_TOKEN" });
                return { status: "FAILED" };
              }

              try {
                const blocks = this.messages(template);
                if (!blocks.length || blocks.length > 5) throw new Error("INVALID_MESSAGE_COUNT");
                const store = this.storeContext(oa);
                const needsDisplayName = blocks.some((block) => block.type === "TEXT" && extractTemplateVariables(block.textTemplate).includes("user.displayName"));
                let displayName = "ลูกค้าคนสำคัญ";
                if (needsDisplayName) {
                  const customer = await this.prisma.customer.findUnique({ where: { lineUserId } });
                  if (customer) {
                    const refreshed = await this.profiles.refresh(customer.id, oa.id, true, "GREETING_MESSAGE").catch(() => customer);
                    if (refreshed.displayName && refreshed.displayName !== "LINE Customer") displayName = refreshed.displayName;
                  }
                }

                const messages: unknown[] = [];
                for (const block of blocks) {
                  if (block.type === "IMAGE") {
                    await this.media.get(block.mediaObjectKey);
                    const previewKey = block.previewObjectKey || block.mediaObjectKey;
                    await this.media.get(previewKey);
                    messages.push({ type: "image", originalContentUrl: createMediaPublicUrl(block.mediaObjectKey), previewImageUrl: createMediaPublicUrl(previewKey) });
                    continue;
                  }
                  let text = block.textTemplate.replace(/\{\{\s*user\.displayName\s*\}\}/g, displayName).replace(/\{\{\s*account\.name\s*\}\}/g, oa.name);
                  for (const variable of extractTemplateVariables(text)) {
                    const value = getStoreVariableValue(variable, store);
                    const prop = variable.startsWith("store.") ? variable.slice(6) : variable;
                    if (!value || (prop === "googleMapsUrl" && !isValidGoogleMapsUrl(value))) throw new Error(`UNRESOLVED_VARIABLE:${variable}`);
                  }
                  text = resolveTemplateVariables(text, store);
                  if (!text.trim()) throw new Error("EMPTY_TEXT");
                  messages.push({ type: "text", text });
                }
                if (!oa.encryptedChannelAccessToken) throw new Error("MISSING_CHANNEL_ACCESS_TOKEN");
                const accessToken = this.encryption.decrypt(oa.encryptedChannelAccessToken);
                const result = await this.messaging.replyMessages(accessToken, replyToken, messages, {
                  userId: lineUserIdHash,
                  storeId: oa.store?.id,
                  storeName: oa.store?.name,
                  messageType: "GREETING",
                });
                if (!result.success) throw new Error(result.invalidReplyToken ? "INVALID_REPLY_TOKEN" : "LINE_REPLY_FAILED");
                await this.record({ ...baseLog, status: GreetingExecutionStatus.SUCCESS, messageCount: messages.length, messageTypesJson: blocks.map((block) => block.type) });
                return { status: "SUCCESS", messageCount: messages.length };
              } catch (error) {
                const reason = error instanceof Error ? error.message.slice(0, 250) : "GREETING_FAILED";
                await this.record({ ...baseLog, status: GreetingExecutionStatus.FAILED, reason });
                this.logger.warn(`Greeting failed for OA ${lineOfficialAccountId}: ${reason}`);
                return { status: "FAILED", reason };
              }
            }
          }
          EOF

          cat > backend/src/greeting/greeting.controller.ts <<'EOF'
          import { BadRequestException, Body, Controller, Get, Param, Patch, Post, Query, Req, UploadedFile, UseGuards, UseInterceptors } from "@nestjs/common";
          import { FileInterceptor } from "@nestjs/platform-express";
          import { memoryStorage } from "multer";
          import { GreetingTemplateStatus, UserRole } from "@prisma/client";
          import { AuthGuard, type AuthRequest } from "../auth/auth.guard";
          import { Roles } from "../auth/auth.decorators";
          import { GreetingService } from "./greeting.service";
          import type { CreateGreetingTemplateDto, GreetingAssignmentsDto, GreetingPreviewDto, UpdateGreetingTemplateDto } from "./greeting.types";

