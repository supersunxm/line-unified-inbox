          import { GreetingSendPolicy } from "@prisma/client";
          import { shouldSendGreeting } from "./greeting-execution.service";

          test("Greeting FIRST_TIME_ONLY skips unblock and prior successful greeting", () => {
            assert.equal(shouldSendGreeting(GreetingSendPolicy.FIRST_TIME_ONLY, true, false), false);
            assert.equal(shouldSendGreeting(GreetingSendPolicy.FIRST_TIME_ONLY, false, true), false);
