<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OPPO Review KPI Checker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 280px;
      margin: 0;
      padding: 16px;
      color: #0f172a;
      background: #ffffff;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      color: #059669;
    }
    .tip {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      color: #166534;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .criteria {
      font-size: 11px;
      color: #475569;
      margin-bottom: 12px;
    }
    .criteria ul {
      margin: 4px 0 0 0;
      padding-left: 18px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: #059669;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      box-sizing: border-box;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #047857;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>⭐</span>
    <h1>OPPO Review KPI</h1>
  </div>
  <div class="tip">
    Open any Google Maps store reviews page. The scanner overlay will appear automatically at the bottom right.
  </div>
  <div class="criteria">
    <strong>Qualified Review Criteria:</strong>
    <ul>
      <li>Within target month</li>
      <li>Contains customer photo</li>
      <li>&gt; 15 Thai words</li>
    </ul>
  </div>
  <a href="https://lineoppo.click/google-review-kpi" target="_blank" class="btn">
    Open lineoppo.click Dashboard ↗
  </a>
</body>
</html>
